function aadhaarVerifyForm(cid){const c=cust(cid);const a=db.accounts.find(x=>x.customerId===cid);if(!c)return toast("Customer not found");modal("🪪 Aadhaar Verification / Linking",`<div class="notice"><b>${esc(c.name)}</b><br>Customer ID: ${esc(c.id)}${a?`<br>Account: ${esc(a.number)}`:""}</div><form onsubmit="aadhaarVerifyDo(event,'${esc(cid)}')"><div class="field"><label>12-digit Aadhaar Number</label><input id="verifyAadhaar" inputmode="numeric" maxlength="12" required value="${esc(c.aadhaar||a?.aadhaar||'')}"></div><label><input id="verifyAadhaarCheck" type="checkbox" ${c.aadhaarVerified?'checked':''}> Mark Aadhaar as VERIFIED & LINKED</label><div class="notice">Verified Aadhaar can be used by a CSP for AEPS Debit / Credit.</div><button class="btn primary">Save Aadhaar Verification</button></form>`)}
function aadhaarVerifyDo(ev,cid){ev.preventDefault();const c=cust(cid),a=db.accounts.find(x=>x.customerId===cid);if(!c)return toast("Customer not found");const n=String($("verifyAadhaar").value||"").replace(/\D/g,"");if(!/^\d{12}$/.test(n))return toast("Enter exactly 12 digits for Aadhaar");const verified=$("verifyAadhaarCheck").checked;if(verified&&db.customers.some(x=>x.id!==cid&&x.aadhaar===n&&x.aadhaarVerified))return toast("This Aadhaar is already linked to another verified customer");c.aadhaar=n;c.aadhaarVerified=verified;if(a){a.aadhaar=n;a.aadhaarVerified=verified;}save();closeM();refresh();toast(verified?"Aadhaar verified & linked":"Aadhaar saved as unverified")}

function accountRuleNotice(a){const r=accountRule(a);return `${r.label} • Minimum Balance ${money(r.minBalance)}${r.minBalance?'':' (No minimum balance)'} • ${r.maxTxn===Infinity?'No per-transaction cap':'Max single transaction '+money(r.maxTxn)}${r.txnChargeRate?` • ${r.txnChargeRate}% charge above ${money(r.txnChargeAbove)}`:''}${r.salaryOnly?' • Employee salary use only':''}`}
function accountTxnCheck(a,amount,context='NORMAL'){const r=accountRule(a),x=Number(amount);if(!a||!Number.isFinite(x)||x<=0)return {ok:false,msg:'Invalid transaction amount'};if(r.salaryOnly&&context==='NORMAL')return {ok:false,msg:'Salary Account is restricted to salary/PF-linked credits and approved salary-linked debits only'};if(r.maxTxn!==Infinity&&x>r.maxTxn)return {ok:false,msg:`${r.label} allows maximum ${money(r.maxTxn)} in a single transaction`};let fee=0;if(r.txnChargeRate&&x>r.txnChargeAbove)fee=Number((x*r.txnChargeRate/100).toFixed(2));return {ok:true,fee,rule:r};}
function upgradeAccountForm(n){const a=acc(n);if(!a)return toast('Account not found');const r=accountRule(a),allowSalary=!!a.employeeSalaryLinked||(db.employees||[]).some(e=>e.mainAccount===a.number);modal('⬆️ Account Upgrade / Type Change',`<div class="notice"><b>A/C ${esc(a.number)}</b><br>Current: <b>${esc(r.label)}</b><br>${accountRuleNotice(a)}</div><form onsubmit="upgradeAccountDo(event,'${esc(a.number)}')"><div class="field"><label>New Account Type</label><select id="upgradeType" required>${accountTypeOptions(a.type,allowSalary)}</select></div><div id="upgradeRulePreview" class="notice"></div><button class="btn primary">Apply Account Upgrade</button></form>`);const update=()=>{const k=String($('upgradeType')?.value||'').toLowerCase(),x=Object.values(NEX_ACCOUNT_TYPES).find(v=>v.key.toLowerCase()===k);if(x&&$('upgradeRulePreview'))$('upgradeRulePreview').innerHTML=`<b>${x.label}</b><br>Minimum Balance: ${money(x.minBalance)}${x.minBalance?'':' — No minimum balance'}<br>${x.maxTxn===Infinity?'Single Transaction Limit: No limit':'Single Transaction Limit: '+money(x.maxTxn)}${x.txnChargeRate?`<br>Transaction Charge: ${x.txnChargeRate}% on transactions above ${money(x.txnChargeAbove)}`:''}${x.salaryOnly?'<br>Employee salary/PF-linked account only':''}`};$('upgradeType')?.addEventListener('change',update);update();}
function upgradeAccountDo(e,n){e.preventDefault();const a=acc(n),key=String($('upgradeType')?.value||'').toLowerCase();if(!a)return toast('Account not found');const x=Object.values(NEX_ACCOUNT_TYPES).find(v=>v.key.toLowerCase()===key);if(!x)return toast('Select a valid account type');if(x.salaryOnly&&!(a.employeeSalaryLinked||(db.employees||[]).some(e=>e.mainAccount===a.number)))return toast('Salary Account is only for employees');a.type=x.key;a.accountTypeLabel=x.label;if(x.salaryOnly)a.employeeSalaryLinked=true;a.upgradedAt=now();rec('ACCOUNT_UPGRADE',0,'Account type changed to '+x.label,a.customerId,a.number);notify('Account upgraded • '+a.number+' → '+x.label);save();closeM();refresh();toast('Account upgraded successfully');}
function createAccount(ref,typeKey="STUDENT_SAVINGS"){let r=db.references.find(x=>x.number===ref&&x.status==="AVAILABLE"),c=r&&cust(r.customerId);if(!r||!c)return toast("Invalid reference");let type=Object.values(NEX_ACCOUNT_TYPES).find(x=>x.key===String(typeKey).toUpperCase())||NEX_ACCOUNT_TYPES.student;if(type.salaryOnly)return toast('Salary Account is created automatically for employees only');let n=nexRandomAccountNumber(),cif=nexRandomCIF();db.accounts.push({number:n,cif,customerId:c.id,type:type.key,accountTypeLabel:type.label,balance:0,status:"ACTIVE",reference:ref,aadhaar:String(c.aadhaar||""),aadhaarVerified:!!c.aadhaarVerified});r.status="USED";rec("ACCOUNT_ACTIVATION",0,"Main Account activated • "+type.label,c.id,n);notify("Main Account activated • "+n);save();closeM();go("accounts");toast(type.label+" ACTIVE")}
function toggleAccount(n){let a=acc(n);a.status=a.status==="ACTIVE"?"INACTIVE":"ACTIVE";save();closeM();refresh();toast("Account status updated")}function closeAccount(n){let a=acc(n);a.status="CLOSED";save();closeM();refresh();toast("Account closed")}
function ensureUpi(c,a){
  if(!c||!a)return null;
  db.upiAccounts=db.upiAccounts||[];
  let u=db.upiAccounts.find(x=>x.accountNumber===a.number);
  if(!u){const mobile=String(c.mobile||'').replace(/\D/g,'').slice(-10)||a.number.slice(-10);u={id:uid('UPI'),customerId:c.id,accountNumber:a.number,upiId:mobile+'@nexbank',pin:'',status:'ACTIVE',createdAt:now()};db.upiAccounts.push(u);}
  return u;
}
function upi(){
  (db.customers||[]).forEach(c=>{const a=db.accounts.find(x=>x.customerId===c.id&&['STUDENT_SAVINGS','ZERO_SAVINGS','PREMIUM_SAVINGS','SAVINGS'].includes(String(x.type||'').toUpperCase()));if(a)ensureUpi(c,a)});save();
  const rows=(db.customers||[]).map(c=>{const a=db.accounts.find(x=>x.customerId===c.id&&['STUDENT_SAVINGS','ZERO_SAVINGS','PREMIUM_SAVINGS','SAVINGS'].includes(String(x.type||'').toUpperCase())),u=a?ensureUpi(c,a):null;return a?`<tr><td><b>${esc(c.name)}</b></td><td>${a.number}</td><td>${u?.upiId||'—'}</td><td>${money(a.balance)}</td><td><span class="badge ${a.status==='ACTIVE'?'green':'red'}">${a.status}</span></td><td><button class="btn primary" onclick="upiTransferForm('${a.number}')">Transfer</button></td></tr>`:''}).join('');
  shell(`<div class="panel"><div class="split"><div><h3>📱 UPI & Account Transfer</h3><span class="muted">Demo UPI system — transfer money instantly from one active Main/Savings Account to another.</span></div><button class="btn primary" onclick="upiTransferForm()">+ New Transfer</button></div><div class="notice"><b>UPI ID:</b> automatically created for every customer Main/Savings Account. Transfers use the bank's internal ledger and update both balances immediately.</div><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Account</th><th>UPI ID</th><th>Balance</th><th>Status</th><th>Action</th></tr>${rows||'<tr><td colspan="6" class="empty">No customer savings accounts</td></tr>'}</table></div></div><div class="panel"><h3>Recent UPI Transfers</h3><div class="tablewrap"><table class="table"><tr><th>Date</th><th>From</th><th>To</th><th>Amount</th><th>Status</th></tr>${db.transactions.filter(t=>t.type==='UPI_TRANSFER').slice(0,50).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.fromAccount||t.account||'—')}</td><td>${esc(t.toAccount||'—')}</td><td>${money(t.amount)}</td><td><span class="badge green">${t.status}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No UPI transfers yet</td></tr>'}</table></div></div>`,'UPI & Account Transfer','Internal UPI-style account-to-account transfer system');
}
function upiTransferForm(prefill){
  modal('📱 UPI Money Transfer',`<form onsubmit="upiTransferDo(event)"><div class="formgrid">${fld('upiFrom','From Account (10 digits)','required')}${fld('upiTo','To Account (10 digits)','required')}${fld('upiAmt','Transfer Amount','required','number')}</div><div class="notice">Only ACTIVE customer Main/Savings Accounts are eligible. Transfer is instant and both accounts are updated together.</div><button class="btn primary">Confirm UPI Transfer</button></form>`);if(prefill)$('upiFrom').value=prefill;
}
function upiTransferDo(e){e.preventDefault();const from=String($('upiFrom').value||'').trim(),to=String($('upiTo').value||'').trim(),amt=Number($('upiAmt').value);if(!/^\d{10}$/.test(from)||!/^\d{10}$/.test(to)||from===to||!Number.isFinite(amt)||amt<=0)return toast('Enter two different 10-digit accounts and a valid amount');const a=db.accounts.find(x=>x.number===from&&['STUDENT_SAVINGS','ZERO_SAVINGS','PREMIUM_SAVINGS','SAVINGS','CURRENT'].includes(String(x.type||'').toUpperCase())&&x.status==='ACTIVE'),b=db.accounts.find(x=>x.number===to&&['STUDENT_SAVINGS','ZERO_SAVINGS','PREMIUM_SAVINGS','SAVINGS','CURRENT'].includes(String(x.type||'').toUpperCase())&&x.status==='ACTIVE');if(!a||!b)return toast('Both accounts must be ACTIVE customer accounts');const chk=accountTxnCheck(a,amt);if(!chk.ok)return toast(chk.msg);const total=Number((amt+chk.fee).toFixed(2));if(Number(a.balance)<total)return toast('Insufficient balance including transaction charge');a.balance=Number((a.balance-total).toFixed(2));b.balance=Number((b.balance+amt).toFixed(2));const fc=cust(a.customerId),tc=cust(b.customerId);ensureUpi(fc,a);ensureUpi(tc,b);rec('UPI_TRANSFER',amt,'UPI transfer • '+(fc?.name||'Sender')+' → '+(tc?.name||'Receiver'),a.customerId,from,'SUCCESS');if(chk.fee)rec('CHARGE',chk.fee,'Zero Savings 3% UPI transaction charge • above ₹10,000',a.customerId,from);db.transactions[0].toAccount=to;db.transactions[0].fromAccount=from;db.transactions[0].receiverCustomerId=b.customerId;notify('UPI transfer successful • '+money(amt)+(chk.fee?' • charge '+money(chk.fee):''));save();closeM();refresh();toast(chk.fee?`UPI successful • ${money(chk.fee)} charge applied`:`UPI transfer successful • ${money(amt)}`)}
function cspFixedIncomeForm(id){const c=db.csps.find(x=>x.id===id);if(!c)return toast('CSP not found');modal('Set CSP Fixed Income',`<form onsubmit="cspFixedIncomeSave(event,'${id}')"><div class="notice"><b>${esc(c.name)}</b> • ${esc(c.code)}<br>Set the monthly fixed income manually based on your performance assessment. This value is separate from transaction/policy commissions.</div>${fld('cspFixedIncome','Monthly Fixed Income (₹)','required','number')}<button class="btn primary">Save Fixed Income</button></form>`);$('cspFixedIncome').value=Number(c.fixedIncome)||0}
function cspFixedIncomeSave(e,id){e.preventDefault();const c=db.csps.find(x=>x.id===id);if(!c)return toast('CSP not found');const v=Number($('cspFixedIncome').value);if(!Number.isFinite(v)||v<0)return toast('Enter a valid fixed income');c.fixedIncome=+v.toFixed(2);const emp=db.employees.find(x=>x.cspCode===c.code||x.isCSPEmployee&&x.name===c.name);if(emp)emp.cspFixedIncome=c.fixedIncome;save();closeM();refresh();toast('CSP fixed income updated to '+money(c.fixedIncome))}
function annualInterestCredit(manual=false){
 const year=new Date().getFullYear(),key=String(year);db.annualInterestLedger=db.annualInterestLedger||[];let credited=0,count=0;
 (db.accounts||[]).filter(a=>a.status==='ACTIVE'&&['STUDENT_SAVINGS','ZERO_SAVINGS','PREMIUM_SAVINGS','SAVINGS'].includes(String(a.type||'').toUpperCase())).forEach(a=>{const exists=db.annualInterestLedger.find(x=>x.account===a.number&&x.year===year);if(exists)return;const rate=Number(db.settings.savings)||0,interest=+(Number(a.balance||0)*rate/100).toFixed(2);if(interest<=0){db.annualInterestLedger.push({account:a.number,year,interest:0,date:now()});return}a.balance=+(Number(a.balance)+interest).toFixed(2);const c=cust(a.customerId);rec('ANNUAL_INTEREST',interest,'Annual Savings Interest Credit • '+rate+'% p.a. • '+year,a.customerId,a.number);db.annualInterestLedger.push({account:a.number,year,interest,date:now()});credited+=interest;count++;notify('Annual interest credited • '+money(interest)+' • '+a.number)});if(count||manual){save();refresh();toast(count?`Annual interest credited to ${count} account(s) • ${money(credited)}`:'No eligible accounts pending annual interest')}return credited}
function annualInterestCheck(){const nowD=new Date();if(nowD.getMonth()===0&&nowD.getDate()===1)annualInterestCredit(false)}
function creditAccountInterestNow(){let credited=0,count=0,rate=Number(db.settings.savings)||0;(db.accounts||[]).filter(a=>a.status==='ACTIVE'&&['STUDENT_SAVINGS','ZERO_SAVINGS','PREMIUM_SAVINGS','SAVINGS'].includes(String(a.type||'').toUpperCase())).forEach(a=>{let interest=Number((Number(a.balance||0)*rate/100).toFixed(2));if(interest>0){a.balance=Number((a.balance+interest).toFixed(2));rec('INTEREST',interest,'Manual Account Interest Credit • '+rate+'%',a.customerId,a.number);credited+=interest;count++;}});if(count){save();refresh();toast('Account interest credited • '+count+' account(s) • '+money(credited))}else toast('No eligible Savings accounts')}

function accounts(){shell(`<div class="panel account-page"><div class="account-head"><div><div class="luxury-kicker">ACCOUNT MANAGEMENT</div><h3>Account Registry</h3><p class="muted">Every customer account is displayed in one clean sequence — Account Number → CIF → Customer → Type → Balance → Status.</p></div><div class="account-tools"><button class="btn primary" onclick="depositForm()">Deposit</button><button class="btn" onclick="withdrawForm()">Debit / Withdrawal</button><button class="btn" onclick="customForm()">Custom Charge</button><button class="btn" onclick="creditAccountInterestNow()">💰 Credit Account Interest</button></div></div><div class="account-list">${db.accounts.map((a,i)=>{const c=cust(a.customerId);return `<article class="account-record"><div class="account-record-head"><span class="account-index">ACCOUNT ${String(i+1).padStart(2,'0')}</span><span class="badge ${a.status==="ACTIVE"?"green":"red"}">${a.status}</span></div><div class="account-sequence"><div class="account-field"><span>01 · Account Number</span><b>${a.number}</b></div><div class="account-field"><span>02 · CIF Number (11 digits)</span><b>${a.cif}</b></div><div class="account-field"><span>03 · Customer Name</span><b>${esc(c?.name||"Customer")}</b></div><div class="account-field"><span>04 · Account Type</span><b>${esc(accountRule(a).label)}</b></div><div class="account-field account-balance"><span>05 · Available Balance</span><b>${money(a.balance)}</b></div></div><div class="account-record-actions"><button class="btn" onclick="accountManage('${a.customerId}')">Manage Account</button><button class="btn" onclick="upgradeAccountForm('${a.number}')">⬆️ Upgrade / Change Type</button><button class="btn" onclick="accountStatement('${a.number}')">Account Statement</button></div></article>`}).join("")||'<div class="empty account-empty">No accounts yet. Create a customer and generate an account first.</div>'}</div></div>`,`Accounts`,`Savings / Current • deposits • withdrawals • charges • interest`) }
function accountOptions(){return db.accounts.filter(a=>a.status==="ACTIVE"&&accountRule(a).key!=="SALARY").map(a=>`<option value="${a.number}">${a.number} — ${esc(cust(a.customerId)?.name||"Customer")}</option>`).join("")}
function depositForm(){modal("Deposit",`<form onsubmit="deposit(event)"><div class="field"><label>Account</label><select id="dn">${accountOptions()}</select></div>${fld("da","Amount","required","number")}<div class="notice">Account-specific transaction limits and charges are applied automatically.</div><button class="btn primary">Credit Deposit</button></form>`)}function deposit(e){e.preventDefault();let a=acc($("dn").value),x=+$("da").value;if(!a||x<=0)return toast("Invalid amount");const chk=accountTxnCheck(a,x);if(!chk.ok)return toast(chk.msg);a.balance=Number((a.balance+x).toFixed(2));rec("DEPOSIT",x,"Deposit • "+accountRule(a).label,a.customerId,a.number);if(chk.fee){a.balance=Number((a.balance-chk.fee).toFixed(2));rec("CHARGE",chk.fee,"Zero Savings 3% transaction charge • deposit above ₹10,000",a.customerId,a.number);notify("Transaction charge applied • "+money(chk.fee));}save();closeM();refresh();toast(chk.fee?`Deposit successful • ${money(chk.fee)} charge applied`:`Deposit successful • ${money(x)}`)}function withdrawForm(){modal("Debit / Withdrawal",`<form onsubmit="withdraw(event)"><div class="field"><label>Account</label><select id="wn">${accountOptions()}</select></div>${fld("wa","Amount","required","number")}<div class="notice">Single-transaction limits and account-specific charges are checked automatically.</div><button class="btn primary">Debit Account</button></form>`)}function withdraw(e){e.preventDefault();let a=acc($("wn").value),x=+$("wa").value;if(!a)return toast("Account not found");const chk=accountTxnCheck(a,x);if(!chk.ok)return toast(chk.msg);const total=Number((x+chk.fee).toFixed(2));if(a.balance<total){rec("WITHDRAWAL",x,"Withdrawal failed — insufficient balance including transaction charge",a.customerId,a.number,"FAILED");save();closeM();refresh();toast("FAILED — insufficient balance for transaction + charge");return}a.balance=Number((a.balance-total).toFixed(2));rec("WITHDRAWAL",x,"Withdrawal • "+accountRule(a).label,a.customerId,a.number);if(chk.fee)rec("CHARGE",chk.fee,"Zero Savings 3% transaction charge • debit above ₹10,000",a.customerId,a.number);save();closeM();refresh();toast(chk.fee?`Withdrawal successful • ${money(chk.fee)} charge applied`:`Withdrawal successful • ${money(x)}`)}function customForm(){modal("Custom Charge",`<form onsubmit="customCharge(event)"><div class="field"><label>Account</label><select id="cc">${accountOptions()}</select></div>${fld("cx","Charge Amount","required","number")}${fld("cd","Description","required")}<button class="btn primary">Apply Charge</button></form>`)}function customCharge(e){e.preventDefault();let a=acc($("cc").value),x=+$("cx").value;a.balance-=x;rec("CHARGE",x,$("cd").value,a.customerId,a.number);save();closeM();refresh();toast("Charge applied")}
function transactions(){shell(`<div class="panel"><h3>Full Transaction History</h3><div class="tablewrap"><table class="table"><tr><th>ID</th><th>Date</th><th>Type</th><th>Account</th><th>Amount</th><th>Status</th><th>Description</th></tr>${db.transactions.map(t=>`<tr><td>${t.id}</td><td>${t.date}</td><td>${t.type}</td><td>${t.account||"—"}</td><td>${money(t.amount)}</td><td><span class="badge ${t.status==="SUCCESS"?"green":"red"}">${t.status}</span></td><td>${esc(t.description)}</td></tr>`).join("")||'<tr><td colspan="7" class="empty">No transactions</td></tr>'}</table></div></div>`,"Transactions","Deposits, withdrawals, charges, interest, EMI, FD withdrawal and failures")}
function investments(){
 const invCard=(type,arr)=>arr.map(x=>`<div class="notice"><div class="split"><span><b>${esc(x.id)}</b><br>${type} • ${Number(x.rate||0)}% per cycle • ${x.status||'ACTIVE'}<br>Installment: ${money(x.amount)} every ${db.settings.investmentEvery||75}s<br><b>Current ${type} Balance: ${money(x.balance||0)}</b><br>Interest compounded inside ${type}: ${money(x.interestAccrued||0)} • Cycles: ${x.paidCycles||0}<br>Linked Main Account: ${esc(x.accountNumber||'—')}</span><span>${x.status==='ACTIVE'?`<button class="btn primary" onclick="invWithdraw('${type}','${x.id}')">Withdraw ${type}</button>`:''}</span></div></div>`).join('')||'<div class="empty">No plans</div>';
 shell(`<div class="grid2"><div class="panel"><div class="split"><h3>Fixed Deposits</h3><button class="btn primary" onclick="fdForm()">+ Create FD</button></div><div class="notice"><b>FD Interest:</b> compounded <b>inside FD Balance</b> every ${db.settings.investmentEvery||75} seconds. Example: ₹50,000 at 7% → ₹53,500 after one completed cycle → next cycle calculates 7% on ₹53,500. Interest reaches Main Account only on withdrawal.</div>${db.fds.map(f=>`<div class="notice split"><span><b>${f.id}</b><br>${f.rate}% per cycle • ${f.tenure} months • ${f.status}<br>FD Balance: ${money(f.balance!==undefined?f.balance:(Number(f.principal||0)+Number(f.interestCredited||0)))} • Compounded Interest: ${money(f.interestCredited||0)} • Cycles: ${f.paidCycles||0}</span><span>${money(f.principal)} ${f.status==="ACTIVE"?`<button class="btn" onclick="fdWithdraw('${f.id}')">⭐ Withdraw FD</button>`:""}</span></div>`).join("")||'<div class="empty">No FD</div>'}</div><div class="panel"><h3>Smart Savings / MMD / SIP</h3><div class="notice"><b>MMD:</b> every ${db.settings.investmentEvery||75}s the installment is <b>debited from Main Account and transferred into MMD Balance</b>. Interest is credited <b>inside MMD Balance</b>. Customer can withdraw the accumulated MMD balance anytime.</div>${invCard('MMD',db.mmd)}<button class="btn primary" onclick="simpleInv('MMD')">+ Create MMD</button><hr><div class="notice"><b>SIP:</b> every ${db.settings.investmentEvery||75}s the installment is <b>debited from Main Account and transferred into SIP Balance</b>. Interest is credited <b>inside SIP Balance</b>. Customer can withdraw the accumulated SIP balance anytime.</div>${invCard('SIP',db.sip)}<button class="btn" onclick="simpleInv('SIP')">+ Create SIP</button></div></div>`,`Deposits & Investments`,`MMD / SIP balance transfer, internal interest credit and anytime withdrawal`)
}
function fdForm(){modal("Create FD",`<form onsubmit="fdCreate(event)"><div class="field"><label>Customer</label><select id="fc">${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>${fld("fp","Deposit Amount","required","number")}${fld("ft","Tenure Months","required","number")}<div class="notice">FD interest compounds <b>inside the FD balance</b> every ${db.settings.investmentEvery||75}s. It is not credited to Main Account until withdrawal.</div><button class="btn primary">Create FD</button></form>`)}
function fdCreate(e){e.preventDefault();let c=$("fc").value,p=+$('fp').value,t=+$('ft').value,a=db.accounts.find(x=>x.customerId===c&&x.status==="ACTIVE");if(!a||p<=0||a.balance<p)return toast("Insufficient account balance");a.balance=Number((a.balance-p).toFixed(2));db.fds.push({id:uid("FD"),customerId:c,accountNumber:a.number,principal:p,balance:p,rate:Number(db.settings.fd)||0,tenure:t,status:"ACTIVE",createdAt:now(),lastInterestAt:Date.now(),interestCredited:0,paidCycles:0});rec("FD_CREATE",p,"FD deposit — funds locked",c,a.number);save();closeM();refresh();toast("FD created • compound interest stays inside FD")}
function fdWithdraw(id){let f=db.fds.find(x=>x.id===id),a=db.accounts.find(x=>x.number===f?.accountNumber)||db.accounts.find(x=>x.customerId===f?.customerId&&x.status==="ACTIVE");if(!a||f.status!=="ACTIVE")return;if(f.balance===undefined)f.balance=Number(f.principal||0)+Number(f.interestCredited||0);let total=Number(f.balance.toFixed(2));if(total<=0)return toast("No FD balance available");a.balance=Number((a.balance+total).toFixed(2));f.status="WITHDRAWN";rec("FD_WITHDRAWAL",total,"FD balance + compounded interest withdrawn to Main Account",f.customerId,a.number);notify("FD withdrawn • "+money(total)+" credited to Main Account");save();refresh();toast("FD withdrawal successful • "+money(total)+" credited to Main Account")}
function simpleInv(type){let accounts=(db.accounts||[]).filter(a=>a.status==="ACTIVE");if(!accounts.length)return toast("Create an ACTIVE Main Account first");modal("Create "+type,`<form onsubmit="simpleInvCreate(event,'${type}')"><div class="field"><label>Customer / Main Account</label><select id="invAccount">${accounts.map(a=>{let c=cust(a.customerId);return `<option value="${a.number}">${esc(a.number)} • ${esc(c?.name||'Customer')}</option>`}).join("")}</select></div>${fld("invAmt",type+" installment per cycle","required","number")}<div class="notice">Every ${db.settings.investmentEvery||75}s the installment will be debited from the selected Main Account and added to the ${type} Balance. Then that entire ${type} Balance earns the configured rate and the interest is compounded inside ${type}.</div><button class="btn primary">Create ${type}</button></form>`)}
function simpleInvCreate(e,type){e.preventDefault();let num=$("invAccount").value,amt=Number($("invAmt").value),a=db.accounts.find(x=>x.number===num);if(!a||!Number.isFinite(amt)||amt<=0)return toast("Enter valid account and amount");let c=cust(a.customerId);db[type.toLowerCase()].push({id:uid(type),customerId:c.id,accountNumber:a.number,amount:+amt.toFixed(2),rate:Number(db.settings[type==="MMD"?"mmd":"sip"])||0,status:"ACTIVE",createdAt:now(),lastAuto:Date.now(),lastInterestAt:Date.now(),balance:0,interestAccrued:0,paidCycles:0});save();closeM();refresh();toast(type+" created • selected Main Account linked")}
function invWithdraw(type,id){let arr=db[type.toLowerCase()]||[],inv=arr.find(x=>x.id===id);if(!inv||inv.status!=="ACTIVE")return toast("Investment not active");let a=db.accounts.find(x=>x.number===inv.accountNumber)||db.accounts.find(x=>x.customerId===inv.customerId&&x.status==="ACTIVE");if(!a)return toast("ACTIVE Main Account required");let total=Number(((inv.balance||0)).toFixed(2));if(total<=0)return toast("No balance available for withdrawal");a.balance=Number((a.balance+total).toFixed(2));inv.status="WITHDRAWN";rec(type.toUpperCase()+"_WITHDRAWAL",total,type+" balance + compounded interest withdrawn to Main Account",inv.customerId,a.number);notify(type+" withdrawn • "+money(total)+" credited to Main Account");save();refresh();toast(type+" withdrawal successful • "+money(total)+" credited to Main Account")}

function cards(){shell(`<div class="panel"><div class="split"><h3>Card Management</h3><button class="btn primary" onclick="cardForm()">+ Card Application</button></div><div class="tablewrap"><table class="table"><tr><th>Card</th><th>Customer</th><th>Type</th><th>Limit</th><th>Available</th><th>Status</th><th>Profile</th><th>Action</th></tr>${db.cards.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(cust(c.customerId)?.name)}</td><td>${c.type}</td><td>${money(c.creditLimit)}</td><td>${money(c.availableCredit)}</td><td><span class="badge ${c.status==="ACTIVE"?"green":"red"}">${c.status}</span></td><td><button class="btn" onclick="cardProfile('${c.id}')">View</button></td><td><button class="btn" onclick="cardToggle('${c.id}')">${c.status==="ACTIVE"?"Block":"Reactivate"}</button></td></tr>`).join("")||'<tr><td colspan="8" class="empty">No cards</td></tr>'}</table></div></div>` ,"Card Management","Debit / Credit cards • applications • approval • limits • block / unblock • card profile")}
function cardProfile(id){let c=db.cards.find(x=>x.id===id),cu=cust(c?.customerId);if(!c)return;let linked=db.finance.filter(f=>f.cardId===c.id);let used=Math.max(0,(c.creditLimit||0)-(c.availableCredit||0));modal("Card Profile",`<div class="data-seq"><div class="data-row"><span class="k">Card ID</span><span class="v">${esc(c.id)}</span></div><div class="data-row"><span class="k">Customer</span><span class="v">${esc(cu?.name||"—")}</span></div><div class="data-row"><span class="k">Linked Main Account</span><span class="v">${esc((db.accounts.find(a=>a.customerId===c.customerId&&a.status==="ACTIVE")||{}).number||"—")}</span></div><div class="data-row"><span class="k">Card Type</span><span class="v">${esc(c.type)}</span></div><div class="data-row"><span class="k">Card Number</span><span class="v">${esc(c.number||"Not assigned")}</span></div><div class="data-row"><span class="k">Credit Limit</span><span class="v">${money(c.creditLimit)}</span></div><div class="data-row"><span class="k">Used / Outstanding</span><span class="v">${money(used)}</span></div><div class="data-row"><span class="k">Available Limit</span><span class="v">${money(c.availableCredit)}</span></div><div class="data-row"><span class="k">Status</span><span class="v">${esc(c.status)}</span></div><div class="data-row"><span class="k">Failed EMI Count</span><span class="v">${c.failedEMIs||0}</span></div><div class="data-row"><span class="k">Linked Product Finance</span><span class="v">${linked.length}</span></div></div><h4>Linked Product Finance</h4>${linked.map(f=>`<div class="notice"><div class="data-seq"><div class="data-row"><span class="k">Finance ID</span><span class="v">${esc(f.id)}</span></div><div class="data-row"><span class="k">Product</span><span class="v">${esc(f.product)}</span></div><div class="data-row"><span class="k">Status</span><span class="v">${esc(f.status)}</span></div><div class="data-row"><span class="k">Outstanding</span><span class="v">${money(f.outstanding)}</span></div></div><button class="btn" onclick="closeM();financeProfile('${f.id}')">Open Finance Profile</button></div>`).join("")||'<div class="empty">No linked product finance</div>'}<div class="profile-actions"><button class="btn" onclick="closeM()">Close</button><button class="btn ${c.status==="ACTIVE"?"danger":"primary"}" onclick="closeM();cardToggle('${c.id}')">${c.status==="ACTIVE"?"Block Card":"Reactivate Card"}</button></div>`)}function cardForm(){modal("Card Application",`<form onsubmit="cardCreate(event)"><div class="field"><label>Customer</label><select id="ctc">${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Type</label><select id="ct"><option value="CREDIT">Credit Card</option><option value="DEBIT">Debit Card</option></select></div>${fld("cl","Credit Limit","required","number")}<button class="btn primary">Approve & Issue</button></form>`)}function cardCreate(e){e.preventDefault();let c=$("ctc").value,l=+$("cl").value;db.cards.push({id:uid("CARD"),customerId:c,type:$("ct").value,creditLimit:l,availableCredit:l,status:"ACTIVE",failedEMIs:0});rec("CARD_ISSUED",0,"Card approved and issued",c,"");save();closeM();refresh();toast("Card issued")}
function cardToggle(id){let c=db.cards.find(x=>x.id===id);if(c.status==="BLOCKED"){let fee=db.settings.cardReactivate,a=db.accounts.find(x=>x.customerId===c.customerId&&x.status==="ACTIVE");if(!a||a.balance<fee)return toast("₹3,375 reactivation charge required");a.balance-=fee;rec("CHARGE",fee,"Card reactivation charge",c.customerId,a.number);c.status="ACTIVE"}else c.status="BLOCKED";save();refresh();toast("Card status updated")}
function loans(){shell(`<div class="panel"><div class="split"><h3>Loan Management</h3><button class="btn primary" onclick="loanForm()">+ Loan Application</button></div><div class="notice">Workflow: <b>PENDING → APPROVE → APPROVED → DISBURSE → DISBURSED → AUTOMATIC EMI → CLOSED → NOC</b></div><div class="tablewrap"><table class="table"><tr><th>Loan ID</th><th>Customer</th><th>Principal</th><th>Rate</th><th>EMI</th><th>Outstanding</th><th>Missed</th><th>Status</th><th>Actions</th></tr>${db.loans.map(l=>`<tr><td>${esc(l.id)}</td><td>${esc(cust(l.customerId)?.name||"—")}</td><td>${money(l.principal)}</td><td>${l.interest}%</td><td>${money(l.emi)}</td><td>${money(l.outstanding)}</td><td>${l.failed||0}</td><td><span class="badge ${l.status==="CLOSED"?"green":l.status==="DISBURSED"?"blue":l.status==="APPROVED"?"blue":"yellow"}">${l.status}</span></td><td><div class="profile-actions"><button class="btn" onclick="loanProfile('${l.id}')">View Profile</button>${l.status==="PENDING"?`<button class="btn success" onclick="loanApprove('${l.id}')">✓ Approve</button><button class="btn danger" onclick="loanReject('${l.id}')">✕ Reject</button>`:""}${l.status==="APPROVED"?`<button class="btn primary" onclick="loanDisburse('${l.id}')">Disburse</button>`:""}</div></td></tr>`).join("")||'<tr><td colspan="9" class="empty">No loans</td></tr>'}</table></div></div>`,`Loan Management`,`Applications • approval • disbursement • automatic EMI • ₹992 missed-EMI charge • loan profile & NOC`) }
function loanEmiCalc(principal,annualRate,months){principal=Number(principal)||0;annualRate=Number(annualRate)||0;months=Math.max(1,Math.floor(Number(months)||1));let r=annualRate/1200;if(r===0)return principal/months;return principal*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1)}function loanTenureHint(){let p=Number($("lp")?.value)||0,t=Number($("lt")?.value)||0,max=p>5000000?120:0;if(max&&t>max){$("lt").value=max;t=max}let emi=loanEmiCalc(p,db.settings.loan,t);$("loanEmiPreview").textContent=p>0&&t>0?`Calculated EMI: ${money(emi)} / month • Interest: ${db.settings.loan}% p.a.${max?` • Maximum tenure for > ₹50 lakh: 120 months (10 years)`:``}`:`Enter principal and tenure to calculate EMI.`}function loanForm(){modal("Loan Application",`<form onsubmit="loanCreate(event)"><div class="field"><label>Customer</label><select id="lc">${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>${fld("lp","Principal Amount","required","number")}${fld("lt","Tenure Months","required","number")}<div id="loanEmiPreview" class="notice">Enter principal and tenure to calculate EMI.</div><button type="submit" class="btn primary">Submit</button></form>`);setTimeout(()=>{$("lp").addEventListener("input",loanTenureHint);$("lt").addEventListener("input",loanTenureHint);loanTenureHint()},0)}function loanCreate(e){e.preventDefault();let c=$("lc").value,p=+$("lp").value,t=Math.floor(+$("lt").value);p=Number(p);t=Number(t);if(!c||p<=0||t<1)return toast("Enter valid principal and tenure");if(p>5000000&&t>120)return toast("Loans above ₹50 lakh can have maximum 10 years (120 months)");let emi=loanEmiCalc(p,db.settings.loan,t);db.loans.push({id:uid("LN"),customerId:c,principal:p,interest:db.settings.loan,tenure:t,emi,outstanding:p,status:"PENDING",paid:0,failed:0,extra:0,lastAuto:Date.now(),history:[]});save();closeM();refresh();toast(`Loan application submitted • EMI ${money(emi)}`)}function loanApprove(id){let l=db.loans.find(x=>x.id===id);if(!l||l.status!=="PENDING")return toast("Only PENDING loans can be approved");l.status="APPROVED";l.approvedAt=now();notify("Loan approved "+id);save();refresh();toast("Loan approved — now ready for disbursement")}function loanReject(id){let l=db.loans.find(x=>x.id===id);if(!l||l.status!=="PENDING")return toast("Only PENDING loans can be rejected");l.status="REJECTED";l.rejectedAt=now();notify("Loan rejected "+id);save();refresh();toast("Loan rejected")}function loanDisburse(id){let l=db.loans.find(x=>x.id===id),a=db.accounts.find(x=>x.customerId===l.customerId&&x.status==="ACTIVE");if(!a)return toast("ACTIVE Main Account required");if(!l||l.status!=="APPROVED")return toast("Only APPROVED loans can be disbursed");a.balance+=l.principal;l.status="DISBURSED";l.lastAuto=Date.now();const rate=Number(db.settings.branchManagerLoanDisbursementRate)||0.1;const comm=+(l.principal*rate/100).toFixed(2);const managers=db.employees.filter(e=>String(e.post||"").trim().toLowerCase()==="branch manager");managers.forEach(m=>{m.branchLoanDisbursementCommissionPending=(Number(m.branchLoanDisbursementCommissionPending)||0)+comm;});rec("LOAN_DISBURSEMENT",l.principal,"Loan disbursement",l.customerId,a.number);if(managers.length)rec("EMPLOYEE_COMMISSION",comm,"Branch Manager loan disbursement commission • "+rate+"% • "+l.id,"",managers[0].mainAccount);notify("Loan disbursed • Branch Manager commission "+money(comm));save();refresh();toast("Loan disbursed"+(managers.length?" • BM commission "+money(comm):""))}
function loanProfile(id){let l=db.loans.find(x=>x.id===id),c=cust(l?.customerId);if(!l)return;let totalPayable=l.emi*l.tenure,interestTotal=Math.max(0,totalPayable-l.principal),closed=l.status==="CLOSED"&&l.outstanding<=0;modal("Loan Profile",`<div class="data-seq"><div class="data-row"><span class="k">Loan ID</span><span class="v">${esc(l.id)}</span></div><div class="data-row"><span class="k">Customer</span><span class="v">${esc(c?.name||"—")}</span></div><div class="data-row"><span class="k">Principal Amount</span><span class="v">${money(l.principal)}</span></div><div class="data-row"><span class="k">Interest Rate</span><span class="v">${l.interest}% p.a.</span></div><div class="data-row"><span class="k">Estimated Interest Amount</span><span class="v">${money(interestTotal)}</span></div><div class="data-row"><span class="k">Total Payable</span><span class="v">${money(totalPayable)}</span></div><div class="data-row"><span class="k">Tenure</span><span class="v">${l.tenure} months</span></div><div class="data-row"><span class="k">EMI</span><span class="v">${money(l.emi)}${l.extra?` + ${money(l.extra)} missed-EMI charge pending`:""}</span></div><div class="data-row"><span class="k">EMIs Paid</span><span class="v">${l.paid}</span></div><div class="data-row"><span class="k">Missed EMIs</span><span class="v">${l.failed}</span></div><div class="data-row"><span class="k">Outstanding Principal</span><span class="v">${money(l.outstanding)}</span></div><div class="data-row"><span class="k">Status</span><span class="v">${l.status}</span></div></div><div class="profile-actions"><button class="btn" onclick="closeM()">Close</button>${l.status==="PENDING"?`<button class="btn success" onclick="closeM();loanApprove('${l.id}')">✓ Approve Loan</button><button class="btn danger" onclick="closeM();loanReject('${l.id}')">✕ Reject Loan</button>`:""}${l.status==="APPROVED"?`<button class="btn primary" onclick="closeM();loanDisburse('${l.id}')">Disburse Loan</button>`:""}${closed?`<button class="btn primary" onclick="loanNOC('${l.id}')">View NOC</button>`:""}</div>`)}function loanNOC(id){let l=db.loans.find(x=>x.id===id),c=cust(l?.customerId);if(!l||l.outstanding>0)return toast("NOC available after full repayment");let principal=l.principal,interest=db.transactions.filter(t=>t.type==="LOAN_INTEREST"&&t.description.includes(l.id)).reduce((a,t)=>a+ +t.amount,0);modal("Loan NOC",`<div class="data-seq"><div class="data-row"><span class="k">NOC Number</span><span class="v">${esc("NOC-"+l.id)}</span></div><div class="data-row"><span class="k">Customer</span><span class="v">${esc(c?.name||"—")}</span></div><div class="data-row"><span class="k">Loan ID</span><span class="v">${esc(l.id)}</span></div><div class="data-row"><span class="k">Principal</span><span class="v">${money(principal)}</span></div><div class="data-row"><span class="k">Interest Collected</span><span class="v">${money(interest)}</span></div><div class="data-row"><span class="k">Missed EMI Charges</span><span class="v">${money((l.extra||0))}</span></div><div class="data-row"><span class="k">Outstanding</span><span class="v">₹0.00</span></div><div class="data-row"><span class="k">Final Status</span><span class="v">CLOSED • FULLY REPAID</span></div></div><div class="notice">This NOC confirms that the above loan has been fully repaid and no principal remains outstanding.</div>`)}
function finance(){shell(`<div class="panel"><div class="split"><h3>Product Finance</h3><button class="btn primary" onclick="financeForm()">+ Product Finance</button></div><div class="tablewrap"><table class="table"><tr><th>Finance ID</th><th>Customer</th><th>Product</th><th>Finance</th><th>DP</th><th>Rate</th><th>EMI</th><th>Outstanding</th><th>Failed</th><th>Status</th><th>Profile</th></tr>${db.finance.map(f=>`<tr><td>${esc(f.id)}</td><td>${esc(cust(f.customerId)?.name)}</td><td><b>${esc(f.product)}</b></td><td>${money(f.amount)}</td><td>${money(f.downPayment||0)}</td><td>${f.interest}%</td><td>${money(f.emi)}</td><td>${money(f.outstanding)}</td><td>${f.failed}</td><td><span class="badge ${f.status==="CLOSED"?"green":"blue"}">${f.status}</span></td><td><button class="btn" onclick="financeProfile('${f.id}')">View</button></td></tr>`).join("")||'<tr><td colspan="11" class="empty">No finance</td></tr>'}</table></div></div>`,`Product Finance`,`Product-wise finance profile • EMI • interest • DP • status • NOC • ₹503 missed-EMI charge`) }
function financeProfile(id){let f=db.finance.find(x=>x.id===id),c=cust(f?.customerId);if(!f)return;let totalPayable=f.emi*f.tenure,interestTotal=Math.max(0,totalPayable-f.amount),closed=f.status==="CLOSED"&&f.outstanding<=0;modal("Product Finance Profile",`<div class="data-seq"><div class="data-row"><span class="k">Product</span><span class="v">${esc(f.product)}</span></div><div class="data-row"><span class="k">Finance ID</span><span class="v">${esc(f.id)}</span></div><div class="data-row"><span class="k">Customer</span><span class="v">${esc(c?.name||"—")}</span></div><div class="data-row"><span class="k">Product Price</span><span class="v">${money((f.amount||0)+(f.downPayment||0))}</span></div><div class="data-row"><span class="k">Down Payment</span><span class="v">${money(f.downPayment||0)}</span></div><div class="data-row"><span class="k">Finance Amount</span><span class="v">${money(f.amount)}</span></div><div class="data-row"><span class="k">Interest Rate</span><span class="v">${f.interest}% p.a.</span></div><div class="data-row"><span class="k">Estimated Interest Amount</span><span class="v">${money(interestTotal)}</span></div><div class="data-row"><span class="k">EMI</span><span class="v">${money(f.emi)}${f.extra?` + ${money(f.extra)} missed-EMI charge pending`:""}</span></div><div class="data-row"><span class="k">EMIs Paid</span><span class="v">${f.paid||0}</span></div><div class="data-row"><span class="k">Failed EMIs</span><span class="v">${f.failed}</span></div><div class="data-row"><span class="k">Consecutive Failed EMIs</span><span class="v">${f.consecutive||0}</span></div><div class="data-row"><span class="k">Penalty Rule</span><span class="v">${f.penaltyAll?"₹503 added to every remaining EMI":"₹503 added after missed EMI; 2 consecutive failures activates penalty on all remaining EMIs"}</span></div><div class="data-row"><span class="k">Outstanding</span><span class="v">${money(f.outstanding)}</span></div><div class="data-row"><span class="k">Status</span><span class="v">${f.status}</span></div></div><div class="profile-actions"><button class="btn" onclick="closeM()">Close</button>${closed?`<button class="btn primary" onclick="financeNOC('${f.id}')">View NOC</button>`:""}</div>`)}function financeNOC(id){let f=db.finance.find(x=>x.id===id),c=cust(f?.customerId);if(!f||f.outstanding>0)return toast("NOC available after full repayment");let interest=db.transactions.filter(t=>t.type==="FINANCE_INTEREST"&&t.description.includes(f.id)).reduce((a,t)=>a+ +t.amount,0);modal("Product Finance NOC",`<div class="data-seq"><div class="data-row"><span class="k">NOC Number</span><span class="v">${esc("NOC-"+f.id)}</span></div><div class="data-row"><span class="k">Customer</span><span class="v">${esc(c?.name||"—")}</span></div><div class="data-row"><span class="k">Product</span><span class="v">${esc(f.product)}</span></div><div class="data-row"><span class="k">Finance ID</span><span class="v">${esc(f.id)}</span></div><div class="data-row"><span class="k">Down Payment</span><span class="v">${money(f.downPayment||0)}</span></div><div class="data-row"><span class="k">Principal Financed</span><span class="v">${money(f.amount)}</span></div><div class="data-row"><span class="k">Interest Collected</span><span class="v">${money(interest)}</span></div><div class="data-row"><span class="k">Outstanding</span><span class="v">₹0.00</span></div><div class="data-row"><span class="k">Final Status</span><span class="v">CLOSED • FULLY REPAID</span></div></div><div class="notice">This NOC confirms full repayment of the product finance facility.</div>`)}
function financeEmiCalc(amount,annualRate,months){return loanEmiCalc(amount,annualRate,months)}function financeEmiPreview(){let p=Number($("price")?.value)||0,d=Number($("down")?.value)||0,t=Math.floor(Number($("fmonths")?.value)||0),amt=p-d;if(t>60){$("fmonths").value=60;t=60}let emi=financeEmiCalc(amt,db.settings.loan,t);$("financeEmiPreview").textContent=amt>0&&t>0?`Finance Amount: ${money(amt)} • EMI: ${money(emi)} / month • ${db.settings.loan}% p.a. • Maximum tenure: 60 months (5 years)`:"Enter price, down payment and tenure to calculate EMI."}function financeForm(){

function financeCreate(e){

function postRank(post){
  const p=String(post||'').trim().toLowerCase();
  if(p==='zonal manager') return 1;
  if(p==='hr manager') return 2;
  if(p==='branch manager') return 3;
  if(p==='cashier') return 4;
  if(p==='bc incharge') return 5;
  if(p==='csp / bc') return 7;
  return 6;
}

function empCreate(ev){
  ev.preventDefault();
  const name=String($('empName')?.value||'').trim(), employeeId=String($('empId')?.value||'').trim(), mobile=String($('empMobile')?.value||'').trim();
  const post=String($('empPost')?.value||'').trim(), mainAccount=String($('empAccount')?.value||'').trim();
  const branchId=String($('empBranch')?.value||'').trim(), branch=db.branches.find(b=>b.id===branchId);
  const basic=Number($('empBasic')?.value||0), bonus=Number($('empBonus')?.value||0), commission=Number($('empCommission')?.value||0), deductions=Number($('empDeductions')?.value||0), tdsRate=Number($('empTds')?.value||0), pfRate=Number($('empPf')?.value||0);
  if(!name||!employeeId||!mobile||!post||!mainAccount)return toast('All required fields fill karo');
  if(!Number.isFinite(basic)||basic<0||!Number.isFinite(bonus)||!Number.isFinite(commission)||!Number.isFinite(deductions)||!Number.isFinite(tdsRate)||!Number.isFinite(pfRate))return toast('Salary values valid rakho');
  if(db.employees.some(e=>String(e.mainAccount)===mainAccount))return toast('This account is already assigned to an employee');
  if(String(post).toLowerCase()==='zonal manager' && db.employees.some(e=>String(e.post||'').toLowerCase()==='zonal manager'))return toast('Only one Zonal Manager can exist');
  if(['HR Manager','HR Officer'].includes(post)){
    const applicationNo='EMP-'+Date.now().toString().slice(-8);
    db.jobApplications.unshift({applicationNo,name,mobile,email:employeeId,position:post,status:'PENDING ZONAL MANAGER APPROVAL',source:'EMPLOYEE MANAGEMENT',submittedAt:now(),receivedAt:now(),salary:{mainAccount,basic,bonus,commission,deductions,tdsRate,pfRate}});
    notify(post+' application sent to Zonal Manager • '+name); save(); closeM(); refresh(); toast(post+' application sent to Zonal Manager'); return false;
  }
  const account=acc(mainAccount); if(!account)return toast('Selected account not found');
  if(account.status!=='ACTIVE')return toast('Selected account must be ACTIVE');
  account.type='SALARY';account.accountTypeLabel='Salary Account';account.employeeSalaryLinked=true;account.employeeStatus='ACTIVE';
  const employee={id:uid('EMP'),customerId:account.customerId,mainAccount:account.number,pfAccount:uid('PF'),name,post,basic,bonus,commission,deductions,pfRate,tdsRate,pfBalance:0,salaryHistory:[],withdrawals:[],mobile,employeeId,branchId:branch?.id||'',branchName:branch?.name||'',salaryAccountType:'SALARY'};
  if(String(post).toLowerCase()==='cashier'){ employee.currentAccount=cspAccountNumber(); employee.currentBalance=0; }
  db.employees.push(employee);
  notify(post+' added to Employee Management • '+name); save(); closeM(); refresh(); toast(name+' added successfully to Employee Management'); return false;
}

function commissionRows(e,h=null){

    rows.push(['Policy Authorisation Commission',h?h.zonalPolicy:e.zonalPolicyCommissionPending||0]);
  }

    rows.push(['CSP Creation Commission',h?h.bcCreation:e.bcCreationCommissionPending||0]);
    rows.push(['Per-Policy Authorisation Commission',h?h.bcPolicy:e.bcPolicyCommissionPending||0]);
  }
  if(is('branch manager')){
    rows.push(['Loan Disbursement Commission @ 0.1%',h?h.branchLoanDisbursement:e.branchLoanDisbursementCommissionPending||0]);

  }
  if(is('cashier')) rows.push(['Cashier Transaction Commission @ 0.01% (₹1 per ₹10,000)',h?h.cashierTransaction:e.cashierTransactionCommissionPending||0]);

    rows.push(['AEPS Withdrawal Commission',h?h.aepsDebitCommission||0:currentAepsDebit]);
    rows.push(['AEPS Deposit Commission',h?h.aepsCreditCommission||0:currentAepsCredit]);
    rows.push(['Account Opening Commission',h?h.cspOpen:e.cspAccountOpeningCommission||0]);
    rows.push(['Balance Check Commission',h?h.cspBalance:e.cspBalanceCheckCommission||0]);

    rows.push(['Premium Policy Commission',h?h.cspPremium:e.cspPremiumPolicyCommission||0]);
  }
  const custom=h?(h.customCommission??0):(Number(e.commission)||0);

function automationRun(manual=false){if(!db.settings.automation&&!manual)return;let changed=false,t=Date.now(),ci=db.settings.chargeEvery*1000,ei=db.settings.emiEvery*1000;
db.accounts.filter(a=>a.status==="ACTIVE").forEach(a=>{const r=accountRule(a);if(r.minBalance<=0||a.balance>=r.minBalance)return;let st=db.chargeState[a.number]||{last:0};if(manual||t-st.last>=ci){a.balance-=r.minCharge;rec("CHARGE",r.minCharge,"Automatic minimum-balance charge • "+r.label,a.customerId,a.number);notify("Minimum-balance charge applied • "+r.label);st.last=t;db.chargeState[a.number]=st;changed=true}});
db.loans.filter(l=>l.status==="DISBURSED"&&l.outstanding>0).forEach(l=>{
  if(manual||t-l.lastAuto>=ei){
    let a=db.accounts.find(x=>x.customerId===l.customerId&&x.status==="ACTIVE"),
        interest=Math.min(l.outstanding,l.outstanding*(l.interest/100)/12),
        penalty=l.extra||0,
        payment=Math.min(l.emi+penalty,l.outstanding+interest+penalty),
        principal=Math.max(0,payment-interest-penalty);
    if(a&&a.balance>=payment){
      a.balance-=payment;l.outstanding=Math.max(0,l.outstanding-principal);l.paid=(l.paid||0)+1;
      if(interest)rec("LOAN_INTEREST",interest,"Loan interest income — bank profit — "+l.id,l.customerId,a.number);
      if(penalty)rec("CHARGE",penalty,"Loan missed EMI charge — ₹992",l.customerId,a.number);
      if(principal)rec("EMI",principal,"Automatic loan EMI — principal — "+l.id,l.customerId,a.number);
      l.extra=0;
      if(l.outstanding<=0){
        l.status="CLOSED";
        if((l.failed||0)===0&&!l.closureCommissionAwarded){
          const managers=db.employees.filter(e=>String(e.post||"").trim().toLowerCase()==="branch manager");
          const closeComm=Number(db.settings.branchManagerLoanClosureCommission)||1780;
          managers.forEach(m=>{m.branchLoanClosureCommissionPending=(Number(m.branchLoanClosureCommissionPending)||0)+closeComm;});
          l.closureCommissionAwarded=true;
          if(managers.length){
            rec("EMPLOYEE_COMMISSION",closeComm,"Branch Manager successful loan closure commission • no late payment • "+l.id,"",managers[0].mainAccount);
            notify("Loan closed successfully • Branch Manager commission "+money(closeComm));
          }
        }
      }
    }else{
      l.failed=(l.failed||0)+1;l.extra=(l.extra||0)+992;
      rec("FAILED_EMI",payment,"Loan EMI failed — ₹992 charge added to next EMI",l.customerId,a?.number||"","FAILED");
    }
    l.lastAuto=t;changed=true;
  }
});

function cspJobPolicyCreate(ev,id){ev.preventDefault();const c=db.csps.find(x=>x.id===id);const zm=db.employees.find(e=>e.id===$('jobZM')?.value&&String(e.post||'').toLowerCase().includes('zonal manager'));if(!c||c.status!=='ACTIVE')return toast('CSP must be ACTIVE');if(c.jobPolicyDone)return toast('Job Policy already completed');if(!zm)return toast('Valid Zonal Manager required');const a=acc(c.currentAccount);if(!a||a.status!=='ACTIVE')return toast('CSP Current Account must be ACTIVE');if(Number(a.balance||0)<10080)return toast('CSP Current Account needs at least ₹10,080');a.balance=Number((Number(a.balance||0)-10080).toFixed(2));const comm=Number(db.settings.zmJobPolicyCommission)||3260;zm.zmJobPolicyCommissionPending=(Number(zm.zmJobPolicyCommissionPending)||0)+comm;c.jobPolicyDone=true;c.jobPolicyAt=now();c.jobPolicyBy=zm.id;rec('JOB_POLICY_CHARGE',10080,'Job Policy charge from CSP Current Account • '+c.code,c.customerId,a.number);rec('ZM_JOB_POLICY_COMMISSION',comm,'Zonal Manager Job Policy Commission • '+c.code,c.customerId,a.number);notify('Job Policy issued for '+c.code+' • ₹10,080 debited from CSP Current Account • ZM commission ₹'+comm.toFixed(2));save();closeM();refresh();toast('Job Policy issued • ₹10,080 debited from CSP Current Account • ZM commission ₹'+comm.toFixed(2))}

  html+='<div class="panel"><div class="split"><div><h3>🤖 Automatic Policy System</h3><span class="muted">Automatic policy requests + separate monthly targets.</span></div><span class="badge '+(auto.enabled?'green':'yellow')+'">'+(auto.enabled?'AUTO ON':'AUTO OFF')+'</span></div><form onsubmit="cspAutoSave(event,'+"'"+c.code+"'"+')"><div class="formgrid">'+fld('paSec','Har kitne seconds','required','number')+fld('paAcc','Accident Policy / Cycle','required','number')+fld('paHealth','Health Insurance / Cycle','required','number')+fld('paPrem','Premium Policy / Cycle','required','number')+'</div><label><input id="paOn" type="checkbox"> Automation ON</label><br><button class="btn primary">Save Automatic Policy Setup</button></form><div class="notice">Cycle: <b>'+(auto.intervalSec||0)+'s</b> • Accident <b>'+(auto.accidentPerCycle||0)+'</b> • Health <b>'+(auto.healthPerCycle||0)+'</b> • Premium <b>'+(auto.premiumPerCycle||0)+'</b> per cycle.<br>Monthly targets are centrally set for all CSPs in the Monthly Policy Target page.</div></div>';

function cspTxnAutoNorm(c){c.txnAutomation=c.txnAutomation||{enabled:false,minAmount:100,maxAmount:5000,intervalSec:60,lastRunAt:0};c.txnAutomation.minAmount=Math.max(100,Math.min(10000,Number(c.txnAutomation.minAmount)||100));c.txnAutomation.maxAmount=Math.max(c.txnAutomation.minAmount,Math.min(10000,Number(c.txnAutomation.maxAmount)||5000));c.txnAutomation.intervalSec=Math.max(1,Number(c.txnAutomation.intervalSec)||60);c.txnAutomation.enabled=!!c.txnAutomation.enabled;c.txnAutomation.lastRunAt=Number(c.txnAutomation.lastRunAt)||0}
function cspTxnAutoSave(ev,code){ev.preventDefault();const c=db.csps.find(x=>x.code===code);if(!c)return toast('CSP not found');cspTxnAutoNorm(c);const mn=Number($('taMin').value),mx=Number($('taMax').value);if(!Number.isFinite(mn)||!Number.isFinite(mx)||!Number.isInteger(mn)||!Number.isInteger(mx)||mn<100||mx>10000||mn>mx)return toast('Amount must be whole numbers from ₹100 to ₹10,000 and minimum must not exceed maximum');c.txnAutomation.minAmount=mn;c.txnAutomation.maxAmount=mx;c.txnAutomation.intervalSec=Math.max(1,Number($('taSec').value)||60);c.txnAutomation.enabled=$('taOn').checked;c.txnAutomation.lastRunAt=Date.now();save();toast(c.txnAutomation.enabled?'Automatic transaction system saved & ON':'Automatic transaction system saved & OFF');cspLogin(c)}
function cspTxnCommissionForAmount(amt){const v=Number(amt)||0;if(v<=2000)return 0;return Number((v*(Number(db.settings.cspDebitDepositRate)||0.09)/100).toFixed(2))}
function cspAutoTransaction(c){cspTxnAutoNorm(c);if(c.status!=='ACTIVE')return false;const a=acc(c.currentAccount);if(!a||a.status!=='ACTIVE')return false;const mn=Math.ceil(c.txnAutomation.minAmount),mx=Math.floor(c.txnAutomation.maxAmount);const amt=Math.floor(mn+Math.random()*(mx-mn+1));const debit=Math.random()<0.5;if(debit&&Number(a.balance||0)<amt){rec('WITHDRAWAL',amt,'CSP AUTO debit — insufficient Current Account balance • '+c.code,c.customerId,c.currentAccount,'FAILED');return false}if(debit){a.balance=Number((Number(a.balance||0)-amt).toFixed(2));rec('WITHDRAWAL',amt,'CSP AUTO debit through Current Account • '+c.code,c.customerId,c.currentAccount,'SUCCESS')}else{a.balance=Number((Number(a.balance||0)+amt).toFixed(2));rec('DEPOSIT',amt,'CSP AUTO credit through Current Account • '+c.code,c.customerId,c.currentAccount,'SUCCESS')}const comm=cspTxnCommissionForAmount(amt);if(comm>0)cspEarnCommission(c.code,comm,'TXN','CSP Auto '+(debit?'Debit':'Deposit')+' Commission • '+(Number(db.settings.cspDebitDepositRate)||0.09)+'% of ₹'+amt.toLocaleString('en-IN'));return true}
function cspTxnAutoTick(force=false){let changed=false,nowMs=Date.now();(db.csps||[]).forEach(c=>{cspTxnAutoNorm(c);if(!c.txnAutomation.enabled||c.status!=='ACTIVE')return;const interval=c.txnAutomation.intervalSec*1000;if(!c.txnAutomation.lastRunAt){c.txnAutomation.lastRunAt=nowMs;changed=true;if(!force)return}let due=force?1:Math.floor((nowMs-c.txnAutomation.lastRunAt)/interval);if(due<1)return;due=Math.min(due,20);for(let i=0;i<due;i++)cspAutoTransaction(c);c.txnAutomation.lastRunAt=force?nowMs:c.txnAutomation.lastRunAt+due*interval;changed=true});if(changed)save()}
setInterval(cspTxnAutoTick,5000);

function cspAutoNorm(c){c.policyAutomation=c.policyAutomation||{enabled:false,intervalSec:60,accidentPerCycle:0,healthPerCycle:0,premiumPerCycle:0,lastRunAt:0,cycleKey:''};c.policyAutomation.intervalSec=Math.max(1,Number(c.policyAutomation.intervalSec)||60);c.policyAutomation.accidentPerCycle=Math.max(0,Math.floor(Number(c.policyAutomation.accidentPerCycle)||0));c.policyAutomation.healthPerCycle=Math.max(0,Math.floor(Number(c.policyAutomation.healthPerCycle)||0));c.policyAutomation.premiumPerCycle=Math.max(0,Math.floor(Number(c.policyAutomation.premiumPerCycle)||0));c.policyAutomation.lastRunAt=Number(c.policyAutomation.lastRunAt)||0;c.policyCounts=c.policyCounts||{accident:0,health:0,premium:0};c.policyTargets=c.policyTargets||{accident:50,health:50,premium:50};c.policyTargets.accident=Math.max(0,Math.floor(Number(c.policyTargets.accident)||50));c.policyTargets.health=Math.max(0,Math.floor(Number(c.policyTargets.health)||50));c.policyTargets.premium=Math.max(0,Math.floor(Number(c.policyTargets.premium)||50));c.serviceAutomation=c.serviceAutomation||{accountNumber:'',intervalSec:60,balanceEnabled:false,statementEnabled:false,lastRunAt:0};c.serviceAutomation.intervalSec=Math.max(1,Number(c.serviceAutomation.intervalSec)||60);c.serviceAutomation.lastRunAt=Number(c.serviceAutomation.lastRunAt)||0}
function cspAutoSave(ev,code){ev.preventDefault();let c=db.csps.find(x=>x.code===code);if(!c)return toast('CSP not found');cspAutoNorm(c);c.policyAutomation.intervalSec=Math.max(1,Math.floor(+$('paSec').value||60));c.policyAutomation.accidentPerCycle=Math.max(0,Math.floor(+$('paAcc').value||0));c.policyAutomation.healthPerCycle=Math.max(0,Math.floor(+$('paHealth').value||0));c.policyAutomation.premiumPerCycle=Math.max(0,Math.floor(+$('paPrem').value||0));c.policyAutomation.enabled=$('paOn').checked;c.policyAutomation.lastRunAt=Date.now();c.policyTargets={accident:Math.max(0,Math.floor(+$('paAccTarget').value||50)),health:Math.max(0,Math.floor(+$('paHealthTarget').value||50)),premium:Math.max(0,Math.floor(+$('paPremTarget').value||50))};save();refresh();toast(c.policyAutomation.enabled?'Automatic policy system saved & ON':'Automatic policy system saved & OFF');cspLogin(c)}
function cspAutoCreatePolicy(c,type){
    const meta=cspPolicyMeta(type);
    const p={id:uid('POL'),policyType:type,accountNumber:String(c.currentAccount||'').replace(/\D/g,'').slice(0,10).padStart(10,'0'),cspCode:c.code,cspId:c.id,areaCode:String(c.areaCode||'').trim(),charge:meta.charge,cspCommission:meta.csp,status:'PENDING',createdAt:now(),createdAtMs:Date.now(),automation:true};
    if(!Array.isArray(db.cspPolicies))db.cspPolicies=[];
    db.cspPolicies.unshift(p);
    // Batch registration is handled by the high-volume IndexedDB queue.
    if(typeof window.__nexRegisterPolicy==='function'){
      Promise.resolve(window.__nexRegisterPolicy(p)).catch(err=>console.error('Policy batch registration failed:',err));
    }
    return p;
  }
function cspAutoTick(force=false){let changed=false,nowMs=Date.now();(db.csps||[]).forEach(c=>{cspAutoNorm(c);if(!c.policyAutomation.enabled||c.status!=='ACTIVE')return;let total=c.policyAutomation.accidentPerCycle+c.policyAutomation.healthPerCycle+c.policyAutomation.premiumPerCycle;if(total<=0)return;if(!c.policyAutomation.lastRunAt){c.policyAutomation.lastRunAt=nowMs;changed=true;if(!force)return}let due=force?1:Math.floor((nowMs-c.policyAutomation.lastRunAt)/(c.policyAutomation.intervalSec*1000));if(due<1)return;due=Math.min(due,20);for(let cycle=0;cycle<due;cycle++){for(let i=0;i<c.policyAutomation.accidentPerCycle;i++)cspAutoCreatePolicy(c,'Accident Policy');for(let i=0;i<c.policyAutomation.healthPerCycle;i++)cspAutoCreatePolicy(c,'Health Insurance');for(let i=0;i<c.policyAutomation.premiumPerCycle;i++)cspAutoCreatePolicy(c,'Premium Policy');}c.policyAutomation.lastRunAt=force?nowMs:c.policyAutomation.lastRunAt+due*c.policyAutomation.intervalSec*1000;changed=true});if(changed)save();if(typeof __nexSchedulePolicyBatchFlush==='function'&&typeof __nexPolicyBatchQueue!=='undefined'&&__nexPolicyBatchQueue.length)__nexSchedulePolicyBatchFlush()}
setInterval(cspAutoTick,5000);setTimeout(cspAutoTick,1500);
function cspServiceAutoNorm(c){c.serviceAutomation=c.serviceAutomation||{accountNumber:'',intervalSec:60,balanceEnabled:false,statementEnabled:false,lastRunAt:0};c.serviceAutomation.accountNumber=String(c.serviceAutomation.accountNumber||'').replace(/\D/g,'').slice(0,10);c.serviceAutomation.intervalSec=Math.max(1,Math.floor(Number(c.serviceAutomation.intervalSec)||60));c.serviceAutomation.balanceEnabled=!!c.serviceAutomation.balanceEnabled;c.serviceAutomation.statementEnabled=!!c.serviceAutomation.statementEnabled;c.serviceAutomation.lastRunAt=Number(c.serviceAutomation.lastRunAt)||0}
function cspServiceAutoSave(ev,code){ev.preventDefault();const c=db.csps.find(x=>x.code===code);if(!c)return toast('CSP not found');cspServiceAutoNorm(c);const acct=String($('saAcct').value||'').trim();if(!/^\d{10}$/.test(acct))return toast('Enter exactly 10-digit customer account number');const a=acc(acct);if(!a||a.status!=='ACTIVE')return toast('Customer account must be ACTIVE');c.serviceAutomation.accountNumber=acct;c.serviceAutomation.intervalSec=Math.max(1,Math.floor(Number($('saSec').value)||60));c.serviceAutomation.balanceEnabled=$('saBalance').checked;c.serviceAutomation.statementEnabled=$('saStatement').checked;c.serviceAutomation.lastRunAt=Date.now();save();toast('Automatic banking services saved');cspLogin(c)}
function cspServiceAutoTick(force=false){let changed=false,nowMs=Date.now();(db.csps||[]).forEach(c=>{cspServiceAutoNorm(c);if(c.status!=='ACTIVE'||(!c.serviceAutomation.balanceEnabled&&!c.serviceAutomation.statementEnabled)||!/^\d{10}$/.test(c.serviceAutomation.accountNumber))return;const a=acc(c.serviceAutomation.accountNumber);if(!a||a.status!=='ACTIVE')return;const interval=c.serviceAutomation.intervalSec*1000;if(!c.serviceAutomation.lastRunAt){c.serviceAutomation.lastRunAt=nowMs;changed=true;if(!force)return}let due=force?1:Math.floor((nowMs-c.serviceAutomation.lastRunAt)/interval);if(due<1)return;due=Math.min(due,20);for(let i=0;i<due;i++){if(c.serviceAutomation.balanceEnabled){const comm=Number(db.settings.cspBalanceCommission)||0.15;cspEarnCommission(c.code,comm,'BALANCE','Automatic Balance Check • A/C '+a.number+' • ₹'+Number(a.balance||0).toFixed(2));rec('CSP_AUTO_BALANCE_CHECK',0,'Automatic Balance Check • '+c.code+' • A/C '+a.number,c.customerId,a.number,'SUCCESS')}if(c.serviceAutomation.statementEnabled){const comm=Number(db.settings.cspStatementCommission)||0.19;cspEarnCommission(c.code,comm,'STATEMENT','Automatic Statement Check • A/C '+a.number);rec('CSP_AUTO_STATEMENT_CHECK',0,'Automatic Statement Check • '+c.code+' • A/C '+a.number,c.customerId,a.number,'SUCCESS')}}c.serviceAutomation.lastRunAt=force?nowMs:c.serviceAutomation.lastRunAt+due*interval;changed=true});if(changed)save()}
setInterval(cspServiceAutoTick,5000);

function cspPolicyMeta(type){
  const m={
    'Accident Policy':{charge:95,csp:Number(db.settings.cspAccidentCommission)||14.36},
    'Health Insurance':{charge:436,csp:Number(db.settings.cspHealthCommission)||23.56},
    'Premium Policy':{charge:1436,csp:Number(db.settings.cspPremiumCommission)||45.98}
  };
  return m[type]||m['Accident Policy'];
}
function findZonalManager(){

      || db.employees.find(e=>String(e.post||'').toLowerCase().includes('zonal manager'));

function cspPolicyForm(code){

function cspEarnCommission(code,amount,type,description){
  const c=db.csps.find(x=>x.code===code);
  if(!c||!Number.isFinite(+amount)||+amount<=0)return false;
  const v=Number((+amount).toFixed(2));
  c.totalCommission=(Number(c.totalCommission)||0)+v;
  if(type==="TXN")c.transactionCommission=(Number(c.transactionCommission)||0)+v;
  if(type==="OPEN")c.accountOpeningCommission=(Number(c.accountOpeningCommission)||0)+v;
  if(type==="BALANCE")c.balanceCheckCommission=(Number(c.balanceCheckCommission)||0)+v;if(type==="STATEMENT")c.statementCommission=(Number(c.statementCommission)||0)+v;
  const e=db.employees.find(x=>x.isCSPEmployee&&x.cspCode===code);
  if(e){
    if(type==="TXN")e.cspTransactionCommission=(Number(e.cspTransactionCommission)||0)+v;
    if(type==="OPEN")e.cspAccountOpeningCommission=(Number(e.cspAccountOpeningCommission)||0)+v;
    if(type==="BALANCE")e.cspBalanceCheckCommission=(Number(e.cspBalanceCheckCommission)||0)+v;if(type==="STATEMENT")e.cspStatementCommission=(Number(e.cspStatementCommission)||0)+v;
  }
  rec("CSP_COMMISSION",v,description,e?.customerId||"",c.salaryAccount,"SUCCESS");
  return true;
}

function workingDaysBetween(start,end){
  if(!start||!end)return 0;
  const a=new Date(start+'T00:00:00'),b=new Date(end+'T00:00:00');
  if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime())||b<a)return 0;
  let n=0,d=new Date(a);
  while(d<=b){const day=d.getDay();if(day!==0)n++;d.setDate(d.getDate()+1)}
  return n;
}
function leaveRate(e){return String(e?.post||'').trim().toLowerCase()==='csp / bc'||e?.isCSPEmployee?898:1760}
function leaveMonthKey(){return salaryMonthKey()}
function leaveSalaryImpact(e){
  if(!e)return {days:0,excessDays:0,deduction:0,records:[]};
  db.leaves=Array.isArray(db.leaves)?db.leaves:[];
  const month=leaveMonthKey();
  const records=db.leaves.filter(l=>l.employeeId===e.id&&String(l.status||'').toUpperCase()==='APPROVED'&&String(l.start||'').slice(0,7)===month&&!l.salaryDeducted);
  const days=records.reduce((n,l)=>n+(Number(l.workingDays)||workingDaysBetween(l.start,l.end)),0);
  const excessDays=Math.max(0,days-3);
  return {days,excessDays,deduction:excessDays*leaveRate(e),records};
}

}

<script>
/* NEX Persistent Storage: localStorage + IndexedDB mirror; both layers use the same database version for reliable recovery. */
(function(){
  const DB_NAME='NEX_PRIVATE_BANK_PERSISTENT';
  const STORE='state';
  const TS_KEY=K+'_PERSIST_TS';
  let idbReady=null;
  function openDB(){
    if(idbReady)return idbReady;
    idbReady=new Promise((resolve,reject)=>{
      if(!window.indexedDB)return reject(new Error('IndexedDB unavailable'));
      const req=indexedDB.open(DB_NAME,3);
      req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('IndexedDB open failed'));
    });
    return idbReady;
  }
  async function putPersistent(){
    try{
      const stamp=Date.now();
      const payload={version:2,updatedAt:stamp,state:{...db,cspPolicies:[]}};
      __nexSet(TS_KEY,String(stamp));
      const d=await openDB();
      await new Promise((resolve,reject)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).put(payload,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
    }catch(e){/* localStorage is still the fallback */}
  }
  async function getPersistent(){
    try{
      const d=await openDB();
      return await new Promise((resolve,reject)=>{const tx=d.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get('main');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)});
    }catch(e){return null}
  }
  const baseSave=window.save;
  let mirrorTimer=null;
  let mirrorBusy=false;
  function queueMirror(delay=1800){
    if(mirrorTimer)clearTimeout(mirrorTimer);
    mirrorTimer=setTimeout(()=>{mirrorTimer=null;if(!mirrorBusy){mirrorBusy=true;putPersistent().finally(()=>{mirrorBusy=false})}},delay);
  }
  window.save=function(){const result=baseSave.apply(this,arguments);queueMirror(1800);return result};
  window.addEventListener('pagehide',()=>{if(__nexSaveTimer){clearTimeout(__nexSaveTimer);__nexSaveTimer=null}try{__nexWriteStorage()}catch(e){};putPersistent()});
  window.addEventListener('beforeunload',()=>{if(__nexSaveTimer){clearTimeout(__nexSaveTimer);__nexSaveTimer=null}try{__nexWriteStorage()}catch(e){};putPersistent()});

  /* On reopen: if browser storage has disappeared, recover the latest IndexedDB snapshot. */
  (async function recover(){
    if(__NEX_FORCE_RESET)return;
    const stored=await getPersistent();
    if(!stored||!stored.state)return;
    let localState=null;
    try{const raw=__nexGet(K);if(raw)localState=JSON.parse(raw)}catch(e){}
    const localTs=Number(__nexGet(TS_KEY)||0) || (localState ? Number(localState.__savedAt||0) : 0);
    if(!localState || stored.updatedAt>localTs){
      db=stored.state;
      try{norm()}catch(e){}
      try{nexSeedTwelveCustomers();save()}catch(e){try{save()}catch(_){}}
      if(typeof refresh==='function')refresh();
      if(db.session)document.body.classList.remove('loginMode');
    }
  })();
})();
