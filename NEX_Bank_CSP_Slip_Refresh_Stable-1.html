<script id="nex-csp-aeps-persistence-fix">
(function(){
  const oldAccountOptions=window.accountOptions;
  const oldAccountTxnCheck=window.accountTxnCheck;
  const oldCspLogin=window.cspLogin;
  const oldSettings=window.settings;
  const oldPremiumNav=window.premiumNav;
  const oldRefresh=window.refresh;

  /* Salary accounts are ordinary deposit/withdrawal accounts in this simulator too. */
  window.accountOptions=function(){
    return (db.accounts||[]).filter(a=>a.status==='ACTIVE').map(a=>`<option value="${esc(a.number)}">${esc(a.number)} — ${esc(cust(a.customerId)?.name||'Customer')} • ${esc(accountRule(a).label)}</option>`).join('');
  };
  window.accountTxnCheck=function(a,amount,context='NORMAL'){
    const result=oldAccountTxnCheck(a,amount,context);
    if(result && !result.ok && a && String(a.type||'').toUpperCase()==='SALARY' && /Salary Account is restricted/.test(result.msg||'')){
      return {ok:true,fee:0,rule:accountRule(a)};
    }
    return result;
  };

  function cspAepsNormalize(c){
    c.aepsAutomation=c.aepsAutomation||{enabled:false,mode:'BOTH',intervalSec:30,minAmount:100,maxAmount:5000,lastRunAt:0,commissionEarned:0,transactionCount:0};
    const a=c.aepsAutomation;
    a.enabled=!!a.enabled;
    a.mode=['BOTH','WITHDRAWAL','DEPOSIT'].includes(a.mode)?a.mode:'BOTH';
    a.intervalSec=Math.max(5,Math.min(3600,Math.floor(Number(a.intervalSec)||30)));
    a.minAmount=Math.max(100,Math.min(50000,Math.floor(Number(a.minAmount)||100)));
    a.maxAmount=Math.max(a.minAmount,Math.min(50000,Math.floor(Number(a.maxAmount)||5000)));
    a.lastRunAt=Number(a.lastRunAt)||0;
    a.commissionEarned=Number(a.commissionEarned)||0;
    a.transactionCount=Number(a.transactionCount)||0;
    return a;
  }
  function activeCustomerAccounts(c){
    return (db.accounts||[]).filter(a=>a.status==='ACTIVE' && a.number!==c.currentAccount && a.number!==c.salaryAccount && !!db.customers.find(x=>x.id===a.customerId));
  }
  function cspAepsCommission(c,amount,type,accountNumber,customerId,automatic){
    const rate=Math.max(0,Math.min(100,Number(db.settings.aepsCommissionRate)||0));
    const commission=Number((amount*rate/100).toFixed(2));
    const st=cspAepsNormalize(c);
    st.commissionEarned=Number((st.commissionEarned+commission).toFixed(2));
    st.transactionCount++;
    c.aepsCommissionEarned=st.commissionEarned;
    if(commission>0){
      cspEarnCommission(c.code,commission,'TXN',`AEPS ${type} ${automatic?'AUTO ':''}Commission • ${rate}% of ₹${amount.toLocaleString('en-IN')}`);
      rec('AEPS_CSP_COMMISSION',commission,`AEPS ${type} commission credited to CSP ${c.code} • ${rate}%`,customerId,accountNumber,'SUCCESS');
    }
    return commission;
  }
  function cspAepsDoTransaction(c,accountNumber,type,amount,identity,automatic=false){
    if(!c||c.status!=='ACTIVE')return {ok:false,msg:'CSP must be ACTIVE'};
    const a=acc(String(accountNumber));
    if(!a||a.status!=='ACTIVE'||!db.customers.find(x=>x.id===a.customerId))return {ok:false,msg:'Select an active customer account'};
    if(!Number.isInteger(amount)||amount<100||amount>50000)return {ok:false,msg:'Amount must be ₹100–₹50,000'};
    const masked=String(identity||'').replace(/\D/g,'').slice(0,3)+'•••••••••';
    if(type==='WITHDRAWAL'&&Number(a.balance||0)<amount){
      rec('AEPS_CSP_FAILED',amount,`AEPS ${automatic?'AUTO ':''}Withdrawal failed • insufficient balance • demo ID ${masked} • CSP ${c.code}`,a.customerId,a.number,'FAILED');
      save();return {ok:false,msg:'Withdrawal failed: insufficient demo balance'};
    }
    if(type==='WITHDRAWAL'){
      a.balance=Number((Number(a.balance||0)-amount).toFixed(2));
      rec(automatic?'AEPS_CSP_AUTO_WITHDRAWAL':'AEPS_CSP_WITHDRAWAL',amount,`AEPS ${automatic?'AUTO ':''}Withdrawal • synthetic ID ${masked} • CSP ${c.code}`,a.customerId,a.number,'SUCCESS');
    }else{
      a.balance=Number((Number(a.balance||0)+amount).toFixed(2));
      rec(automatic?'AEPS_CSP_AUTO_DEPOSIT':'AEPS_CSP_DEPOSIT',amount,`AEPS ${automatic?'AUTO ':''}Deposit • synthetic ID ${masked} • CSP ${c.code}`,a.customerId,a.number,'SUCCESS');
    }
    const commission=cspAepsCommission(c,amount,type,a.number,a.customerId,automatic);
    notify(`CSP ${c.code} AEPS ${type} • ₹${amount} • CSP commission ₹${commission.toFixed(2)}`);
    save();
    return {ok:true,commission,account:a};
  }
  window.cspAepsManualForm=function(code){
    const c=db.csps.find(x=>x.code===code);if(!c)return toast('CSP not found');
    const accounts=activeCustomerAccounts(c);
    modal('🪪 CSP AEPS Transaction',`<div class="notice"><b>Practice simulator only.</b> Enter any 12-digit synthetic test value. No real Aadhaar authentication or bank-network transaction occurs. Only the logged-in CSP receives the demo commission. Demo state is saved locally and mirrored to IndexedDB when supported.</div><form onsubmit="cspAepsManualDo(event,'${esc(code)}')"><div class="formgrid"><div class="field"><label>12-digit synthetic ID</label><input id="cspAepsIdentity" inputmode="numeric" maxlength="12" pattern="[0-9]{12}" placeholder="Any 12 digits for testing" required></div><div class="field"><label>AEPS Type</label><select id="cspAepsType"><option value="WITHDRAWAL">Aadhaar Withdrawal</option><option value="DEPOSIT">Aadhaar Deposit</option></select></div><div class="field"><label>Customer Account</label><select id="cspAepsAccount" required>${accounts.map(a=>`<option value="${esc(a.number)}">${esc(a.number)} • ${esc(cust(a.customerId)?.name||'Customer')} • ${money(a.balance||0)}</option>`).join('')}</select></div><div class="field"><label>Amount ₹100–₹50,000</label><input id="cspAepsAmount" type="number" min="100" max="50000" step="1" required></div></div><button class="btn primary">Process AEPS Demo Transaction</button></form>`);
  };
  window.cspAepsManualDo=function(e,code){
    e.preventDefault();const c=db.csps.find(x=>x.code===code);const id=String($('cspAepsIdentity').value||'').replace(/\D/g,'');
    if(!/^\d{12}$/.test(id))return toast('Enter any 12-digit synthetic test value');
    const result=cspAepsDoTransaction(c,$('cspAepsAccount').value,$('cspAepsType').value,Number($('cspAepsAmount').value),id,false);
    if(!result.ok)return toast(result.msg);
    closeM();refresh();toast(`AEPS successful • CSP commission ${money(result.commission)}`);
  };
  window.cspAepsAutomationSave=function(e,code){
    e.preventDefault();const c=db.csps.find(x=>x.code===code);if(!c)return toast('CSP not found');const a=cspAepsNormalize(c);
    const min=Number($('cspAepsMin').value),max=Number($('cspAepsMax').value),sec=Number($('cspAepsSec').value);
    if(!Number.isInteger(min)||!Number.isInteger(max)||min<100||max>50000||min>max)return toast('Use whole-number amount range ₹100–₹50,000');
    a.enabled=$('cspAepsOn').checked;a.mode=$('cspAepsMode').value;a.minAmount=min;a.maxAmount=max;a.intervalSec=Math.max(5,Math.min(3600,Math.floor(sec)||30));a.lastRunAt=Date.now();
    save();refresh();toast(a.enabled?'CSP-specific AEPS automation saved and enabled':'CSP-specific AEPS automation saved and disabled');
  };
  window.cspAepsRunOnce=function(code){const c=db.csps.find(x=>x.code===code);if(!c)return toast('CSP not found');const a=cspAepsNormalize(c);const accounts=activeCustomerAccounts(c);if(!accounts.length)return toast('No active customer accounts');const account=accounts[Math.floor(Math.random()*accounts.length)];const type=a.mode==='BOTH'?(Math.random()<0.5?'WITHDRAWAL':'DEPOSIT'):a.mode;const amount=Math.floor(a.minAmount+Math.random()*(a.maxAmount-a.minAmount+1));const identity=String(Math.floor(100000000000+Math.random()*900000000000));const result=cspAepsDoTransaction(c,account.number,type,amount,identity,true);a.lastRunAt=Date.now();save();refresh();toast(result.ok?`AEPS ${type} complete • CSP ${code} commission ${money(result.commission)}`:result.msg);};

  function renderCspAepsPanel(c){
    const a=cspAepsNormalize(c),logs=(db.transactions||[]).filter(t=>String(t.description||'').includes('CSP '+c.code)&&String(t.type||'').startsWith('AEPS_CSP')).slice(0,20);
    return `<div class="panel" id="cspAepsPanel"><div class="split"><div><h3>🪪 AEPS Aadhaar Withdrawal / Deposit</h3><p class="muted">CSP-only operations • separate automation for this CSP • commission credited individually.</p></div><span class="badge ${a.enabled?'green':'yellow'}">${a.enabled?'AEPS AUTO ON':'AEPS AUTO OFF'}</span></div><div class="notice">Simulation only: synthetic 12-digit test IDs, no real Aadhaar authentication, UIDAI/NPCI connection, or actual money movement. Commission rate is configured by Admin in Settings: <b>${Number(db.settings.aepsCommissionRate)||0}%</b>.</div><div class="grid">${stat('This CSP AEPS Commission',money(a.commissionEarned),'Only transactions by '+esc(c.code))}${stat('Successful AEPS Count',a.transactionCount,'Individual CSP total')}${stat('Automation Interval',a.intervalSec+' sec','Minimum 5 seconds')}${stat('Amount Range',money(a.minAmount)+' – '+money(a.maxAmount),'Random demo amount')}</div><div class="actions" style="margin:12px 0"><button class="btn primary" onclick="cspAepsManualForm('${esc(c.code)}')">＋ Manual AEPS Transaction</button><button class="btn" onclick="cspAepsRunOnce('${esc(c.code)}')">▶ Run One AEPS Cycle</button></div><form onsubmit="cspAepsAutomationSave(event,'${esc(c.code)}')"><div class="formgrid"><div class="field"><label>Automation</label><label><input id="cspAepsOn" type="checkbox" ${a.enabled?'checked':''}> Enable AEPS automation for this CSP</label></div><div class="field"><label>Transaction mode</label><select id="cspAepsMode"><option value="BOTH" ${a.mode==='BOTH'?'selected':''}>Withdrawal + Deposit</option><option value="WITHDRAWAL" ${a.mode==='WITHDRAWAL'?'selected':''}>Withdrawal only</option><option value="DEPOSIT" ${a.mode==='DEPOSIT'?'selected':''}>Deposit only</option></select></div><div class="field"><label>Minimum amount ₹</label><input id="cspAepsMin" type="number" min="100" max="50000" value="${a.minAmount}" required></div><div class="field"><label>Maximum amount ₹</label><input id="cspAepsMax" type="number" min="100" max="50000" value="${a.maxAmount}" required></div><div class="field"><label>Interval seconds</label><input id="cspAepsSec" type="number" min="5" max="3600" value="${a.intervalSec}" required></div></div><button class="btn primary">Save This CSP AEPS Automation</button></form><div class="panel"><h3>Recent AEPS Transactions • ${esc(c.code)}</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Customer Account</th><th>Amount</th><th>Status</th><th>Details</th></tr></thead><tbody>${logs.map(t=>`<tr><td>${esc(t.date||'')}</td><td>${esc(t.type)}</td><td>${esc(t.account||'—')}</td><td>${money(t.amount||0)}</td><td>${esc(t.status||'SUCCESS')}</td><td>${esc(t.description||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No AEPS entries for this CSP yet.</td></tr>'}</tbody></table></div></div></div>`;
  }
  window.cspLogin=function(c){
    oldCspLogin(c);
    if(!c||!document.querySelector('.main'))return;
    db.lastCspPortalCode=c.code;db.lastPageWasCspPortal=true;
    try{__nexSessionSet('nexCsp',c.code);localStorage.setItem(K+'_LAST_PAGE','cspPortal');}catch(e){}
    if(location.hash.slice(1)!=='cspPortal')location.hash='cspPortal';
    const main=document.querySelector('.main');const old=main.querySelector('#cspAepsPanel');if(old)old.remove();
    main.insertAdjacentHTML('beforeend',renderCspAepsPanel(c));
    save();
  };

  /* Each CSP's own timer; only the signed-in CSP portal is allowed to launch it. */
  setInterval(function(){
    const code=__nexSessionGet('nexCsp');if(!code)return;
    const c=db.csps.find(x=>x.code===code);if(!c||c.status!=='ACTIVE')return;
    const a=cspAepsNormalize(c);if(!a.enabled)return;
    const nowMs=Date.now();if(!a.lastRunAt){a.lastRunAt=nowMs;save();return;}
    if(nowMs-a.lastRunAt<a.intervalSec*1000)return;
    const accounts=activeCustomerAccounts(c);if(!accounts.length){a.lastRunAt=nowMs;save();return;}
    const account=accounts[Math.floor(Math.random()*accounts.length)];const type=a.mode==='BOTH'?(Math.random()<0.5?'WITHDRAWAL':'DEPOSIT'):a.mode;
    const amount=Math.floor(a.minAmount+Math.random()*(a.maxAmount-a.minAmount+1));const identity=String(Math.floor(100000000000+Math.random()*900000000000));
    cspAepsDoTransaction(c,account.number,type,amount,identity,true);a.lastRunAt=nowMs;save();
    if(location.hash.slice(1)==='cspPortal'){const panel=document.querySelector('#cspAepsPanel');if(panel)panel.outerHTML=renderCspAepsPanel(c);}
  },1000);

  /* Remove the bank-wide AEPS page/automation. Commission percentage remains an Admin setting. */
  window.aepsAutomationTick=function(){return false};
  window.aepsManualForm=function(){return toast('AEPS transactions are available only inside each CSP Portal')};
  window.aepsAutomationPage=function(){return cspPortal()};
  window.premiumNav=function(){return oldPremiumNav().replace(/<button data-nav="aepsauto"[\s\S]*?<\/button>/,'')};
  window.refresh=function(){const page=location.hash.slice(1)||__nexGet(K+'_LAST_PAGE')||'dashboard';if(page==='aepsauto')return cspPortal();if(page==='cspPortal'){const c=db.csps.find(x=>x.code===db.lastCspPortalCode);if(c&&db.lastPageWasCspPortal)return window.cspLogin(c);return cspPortal()}return oldRefresh()};
  window.settings=function(){
    oldSettings();
    const main=document.querySelector('.main');if(!main)return;
    const existing=main.querySelector('#aepsSettingsPanel');if(existing)existing.remove();
    const rate=Math.max(0,Math.min(100,Number(db.settings.aepsCommissionRate)||0.1));
    main.insertAdjacentHTML('beforeend',`<div class="panel" id="aepsSettingsPanel"><h3>🪪 AEPS Commission Settings</h3><p class="muted">Admin-only percentage setting. Successful AEPS demo commission is credited to the individual CSP that processed the transaction.</p><div class="notice">AEPS operations and automation exist only inside CSP portals. Branch and bank-wide screens cannot run AEPS transactions. No real Aadhaar or banking network is connected.</div><form onsubmit="nexSaveAepsCommission(event)"><div class="field"><label>AEPS Commission Rate (%)</label><input id="nexAepsCommissionRate" type="number" min="0" max="100" step="0.01" value="${rate}" required></div><button class="btn primary">Save AEPS Commission Rate</button></form></div>`);
  };
  window.nexSaveAepsCommission=function(e){e.preventDefault();const v=Number($('nexAepsCommissionRate').value);if(!Number.isFinite(v)||v<0||v>100)return toast('Commission rate must be 0–100%');db.settings.aepsCommissionRate=Number(v.toFixed(2));save();settings();toast('AEPS commission rate saved • '+db.settings.aepsCommissionRate+'%')};

  /* Immediate local save plus IndexedDB mirror; persist the last open page and active session. */
  const originalSave=window.save;
  window.save=function(){
    const stamp=Date.now();
    try{localStorage.setItem(K,JSON.stringify({...db,cspPolicies:[],__savedAt:stamp}));localStorage.setItem(K+'_PERSIST_TS',String(stamp));}catch(e){console.warn('NEX localStorage save unavailable; IndexedDB backup will be attempted',e)}
    try{if(location.hash&&location.hash.length>1)localStorage.setItem(K+'_LAST_PAGE',location.hash.slice(1));}catch(e){}
    try{
      if(window.indexedDB){const snapshot=JSON.stringify({...db,cspPolicies:[]});const req=indexedDB.open('NEX_PRIVATE_BANK_PERSISTENT',3);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state')};req.onsuccess=()=>{try{const d=req.result;if(!d.objectStoreNames.contains('state')){d.close();return}const tx=d.transaction('state','readwrite');tx.objectStore('state').put({version:3,updatedAt:stamp,state:JSON.parse(snapshot)},'main');tx.oncomplete=()=>d.close();tx.onerror=()=>{try{d.close()}catch(e){}};}catch(e){}};req.onerror=()=>console.warn('NEX IndexedDB backup unavailable',req.error);}
    }catch(e){}
    return originalSave.apply(this,arguments);
  };
  window.addEventListener('pagehide',function(){try{localStorage.setItem(K,JSON.stringify({...db,cspPolicies:[]}));localStorage.setItem(K+'_PERSIST_TS',String(Date.now()));if(location.hash)localStorage.setItem(K+'_LAST_PAGE',location.hash.slice(1));}catch(e){}});
  window.addEventListener('hashchange',function(){try{if(location.hash)localStorage.setItem(K+'_LAST_PAGE',location.hash.slice(1));}catch(e){}});
})();
</script>

<script id="nex-final-workflow-fix-20261012">
(function(){
  const oldSalaryCalc=window.salaryCalc;
  const oldCspFixedIncomeForm=window.cspFixedIncomeForm;
  const oldCspFixedIncomeSave=window.cspFixedIncomeSave;
  const oldCspAutoSave=window.cspAutoSave;
  const oldRefresh=window.refresh;
  const oldSalaryCredit=window.salaryCredit;
  const oldSalaryCreditOne=window.salaryCreditOne;
  const oldPremiumNav=window.premiumNav;

  const policyNames={accident:'Accident Policy',health:'Health Insurance',premium:'Premium Policy'};
  const monthKey=()=>typeof salaryMonthKey==='function'?salaryMonthKey():new Date().toISOString().slice(0,7);
  const num=v=>Math.max(0,Number(v)||0);
  const successful=t=>String(t?.status||'SUCCESS').toUpperCase()==='SUCCESS';
  function commonTargets(){
    db.settings=db.settings||{};
    const m=monthKey();
    let t=db.settings.monthlyPolicyTargets;
    if(!t||t.month!==m)t={month:m,accident:50,health:50,premium:50};
    t.accident=Math.max(0,Math.floor(Number(t.accident)||0));
    t.health=Math.max(0,Math.floor(Number(t.health)||0));
    t.premium=Math.max(0,Math.floor(Number(t.premium)||0));
    db.settings.monthlyPolicyTargets=t;
    return t;
  }
  function fixedSalaryFor(e,c){
    if(c && c.fixedIncomeManual===undefined && Number(c.fixedIncome)>0)c.fixedIncomeManual=true;
    if(c?.fixedIncomeManual)return num(c.fixedIncome);
    if(e && e.cspFixedIncomeManual)return num(e.cspFixedIncome);
    const paid=(Array.isArray(e?.salaryHistory)?e.salaryHistory:[]).filter(h=>h&&Number.isFinite(Number(h.net))).length;
    return paid<6?3920:1236;
  }

  window.nexEffectiveCspFixedSalary=function(c){const e=(db.employees||[]).find(x=>x.isCSPEmployee&&x.cspCode===c?.code);return fixedSalaryFor(e||{salaryHistory:[]},c)};

  // Keep the per-CSP override, while the default fixed salary follows each CSP's successful credits.
  window.salaryCalc=function(e){
    const c=e?.isCSPEmployee?(db.csps||[]).find(x=>x.code===e.cspCode):null;
    const oldCspTargets=c?.policyTargets;
    const oldEmpFixed=e?.cspFixedIncome;
    const oldCspFixed=c?.fixedIncome;
    const oldCspManual=c?.fixedIncomeManual;
    if(c){c.policyTargets={...commonTargets()};c.fixedIncome=fixedSalaryFor(e,c);}
    else if(e?.isCSPEmployee)e.cspFixedIncome=fixedSalaryFor(e,null);
    let out;
    try{out=oldSalaryCalc(e)}finally{
      if(c){c.policyTargets=oldCspTargets;c.fixedIncome=oldCspFixed;c.fixedIncomeManual=oldCspManual;}
      if(e?.isCSPEmployee)e.cspFixedIncome=oldEmpFixed;
    }
    return out;
  };

  window.cspFixedIncomeForm=function(id){
    const c=(db.csps||[]).find(x=>x.id===id);if(!c)return toast('CSP not found');
    const e=(db.employees||[]).find(x=>x.isCSPEmployee&&x.cspCode===c.code);
    const automatic=fixedSalaryFor(e||{salaryHistory:[]},c);
    modal('Set CSP Fixed Salary',`<form onsubmit="cspFixedIncomeSave(event,'${esc(id)}')"><div class="notice"><b>${esc(c.name)}</b> • ${esc(c.code)}<br>Default: ₹3,920 for the first 6 successful salary credits, then ₹1,236. You can keep the automatic rule or set a different fixed salary for this CSP.</div><div class="field"><label><input id="cspFixedAuto" type="checkbox" ${c.fixedIncomeManual?'':'checked'}> Use automatic 6-cycle salary rule</label></div>${fld('cspFixedIncome','Individual Fixed Salary (₹)','required','number')}<button class="btn primary">Save Fixed Salary</button></form>`);
    $('cspFixedIncome').value=c.fixedIncomeManual?Number(c.fixedIncome)||0:automatic;
    $('cspFixedIncome').disabled=!c.fixedIncomeManual;
    $('cspFixedAuto').addEventListener('change',ev=>{$('cspFixedIncome').disabled=ev.target.checked;if(ev.target.checked)$('cspFixedIncome').value=automatic;});
  };
  window.cspFixedIncomeSave=function(e,id){
    e.preventDefault();const c=(db.csps||[]).find(x=>x.id===id);if(!c)return toast('CSP not found');
    const auto=$('cspFixedAuto')?.checked;const v=Number($('cspFixedIncome').value);
    if(!auto&&(!Number.isFinite(v)||v<0))return toast('Enter a valid fixed salary');
    c.fixedIncomeManual=!auto;
    if(!auto)c.fixedIncome=Number(v.toFixed(2));
    const emp=(db.employees||[]).find(x=>x.isCSPEmployee&&x.cspCode===c.code);
    if(emp){emp.cspFixedIncomeManual=!auto;if(!auto)emp.cspFixedIncome=c.fixedIncome;}
    save();closeM();refresh();toast(auto?'Automatic CSP fixed salary rule enabled':'Individual CSP fixed salary saved');
  };

  // One shared monthly target set for every CSP, with CSP-wise progress visible on one page.
  window.policyTargetsPage=function(){
    const t=commonTargets();
    const csps=(db.csps||[]).filter(c=>c.status!=='DELETED');
    const policyCount=(c,k)=>Math.max(0,Number(c.policyCounts?.[k])||0);
    shell(`<div class="panel"><div class="split"><div><h3>🎯 Monthly Policy Targets</h3><p class="muted">One common target applies to every CSP. Only these policies are included.</p></div><span class="badge green">${esc(t.month)}</span></div><form onsubmit="saveCommonPolicyTargets(event)"><div class="formgrid">${fld('targetAccident','Accident Policy target per CSP','required','number')}${fld('targetHealth','Health Insurance target per CSP','required','number')}${fld('targetPremium','Premium Policy target per CSP','required','number')}</div><button class="btn primary">Save Common Monthly Targets</button></form><div class="grid" style="margin-top:12px">${stat('Managed CSPs',csps.length,'Common target applies to each CSP')}${stat('Accident target',t.accident,'per CSP / month')}${stat('Health target',t.health,'per CSP / month')}${stat('Premium target',t.premium,'per CSP / month')}</div></div><div class="panel"><h3>CSP-wise Progress</h3><div class="tablewrap"><table><thead><tr><th>CSP</th><th>Accident Policy</th><th>Health Insurance</th><th>Premium Policy</th><th>Total Completed</th></tr></thead><tbody>${csps.map(c=>{const a=policyCount(c,'accident'),h=policyCount(c,'health'),p=policyCount(c,'premium');return `<tr><td>${esc(c.name)}<br><small>${esc(c.code)}</small></td><td>${a} / ${t.accident}</td><td>${h} / ${t.health}</td><td>${p} / ${t.premium}</td><td>${a+h+p}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No CSPs configured.</td></tr>'}</tbody></table></div></div>`,'Monthly Policy Targets','Common targets for Accident Policy, Health Insurance and Premium Policy');
    $('targetAccident').value=t.accident;$('targetHealth').value=t.health;$('targetPremium').value=t.premium;
  };
  window.saveCommonPolicyTargets=function(e){
    e.preventDefault();const values={accident:Number($('targetAccident').value),health:Number($('targetHealth').value),premium:Number($('targetPremium').value)};
    if(Object.values(values).some(v=>!Number.isInteger(v)||v<0||v>1000000))return toast('Targets must be whole numbers from 0 to 1,000,000');
    db.settings.monthlyPolicyTargets={month:monthKey(),...values};
    (db.csps||[]).forEach(c=>{c.policyTargets={...values};});save();policyTargetsPage();toast('Common monthly targets saved for all CSPs');
  };

  // CSP portal automation remains per-CSP; targets are read centrally, not edited per CSP.
  window.cspAutoSave=function(ev,code){
    ev.preventDefault();const c=(db.csps||[]).find(x=>x.code===code);if(!c)return toast('CSP not found');cspAutoNorm(c);
    c.policyAutomation.intervalSec=Math.max(1,Math.floor(Number($('paSec')?.value)||60));
    c.policyAutomation.accidentPerCycle=Math.max(0,Math.floor(Number($('paAcc')?.value)||0));
    c.policyAutomation.healthPerCycle=Math.max(0,Math.floor(Number($('paHealth')?.value)||0));
    c.policyAutomation.premiumPerCycle=Math.max(0,Math.floor(Number($('paPrem')?.value)||0));
    c.policyAutomation.enabled=!!$('paOn')?.checked;c.policyAutomation.lastRunAt=Date.now();c.policyTargets={...commonTargets()};
    save();refresh();toast(c.policyAutomation.enabled?'Automatic policy system saved & ON':'Automatic policy system saved & OFF');cspLogin(c);
  };

  function getCspTotals(c){
    const all=(db.transactions||[]).filter(successful);
    const code=String(c.code||'');
    const moneyTypes=new Set(['DEPOSIT','WITHDRAWAL','CREDIT','DEBIT','AEPS_CSP_WITHDRAWAL','AEPS_CSP_DEPOSIT','AEPS_CSP_AUTO_WITHDRAWAL','AEPS_CSP_AUTO_DEPOSIT']);
    const rows=all.filter(t=>{
      const type=String(t.type||'').toUpperCase();
      if(!moneyTypes.has(type))return false;
      if(String(t.account||'')===String(c.currentAccount||''))return true;
      return String(t.description||'').includes('CSP '+code);
    });
    const debit=rows.filter(t=>['WITHDRAWAL','DEBIT','AEPS_CSP_WITHDRAWAL','AEPS_CSP_AUTO_WITHDRAWAL'].includes(String(t.type||'').toUpperCase()));
    const credit=rows.filter(t=>['DEPOSIT','CREDIT','AEPS_CSP_DEPOSIT','AEPS_CSP_AUTO_DEPOSIT'].includes(String(t.type||'').toUpperCase()));
    const sum=a=>a.reduce((v,t)=>v+num(t.amount),0);
    const current=String(c.policyMonthKey||'')===String(monthKey());
    const hist=(db.employees||[]).find(e=>e.isCSPEmployee&&e.cspCode===c.code)?.salaryHistory?.find(h=>h.month===monthKey());
    const pc=c.policyCounts||{};
    const accident=hist?num(hist.accidentPolicyCount):num(pc.accident),health=hist?num(hist.healthPolicyCount):num(pc.health),premium=hist?num(hist.premiumPolicyCount):num(pc.premium);
    return {transactionCount:rows.length,transactionAmount:sum(rows),debitCount:debit.length,debitAmount:sum(debit),creditCount:credit.length,creditAmount:sum(credit),accident,health,premium,policyCount:accident+health+premium,aepsDebitCount:rows.filter(t=>['AEPS_CSP_WITHDRAWAL','AEPS_CSP_AUTO_WITHDRAWAL'].includes(String(t.type||'').toUpperCase())).length,aepsCreditCount:rows.filter(t=>['AEPS_CSP_DEPOSIT','AEPS_CSP_AUTO_DEPOSIT'].includes(String(t.type||'').toUpperCase())).length,aepsDebitAmount:sum(rows.filter(t=>['AEPS_CSP_WITHDRAWAL','AEPS_CSP_AUTO_WITHDRAWAL'].includes(String(t.type||'').toUpperCase()))),aepsCreditAmount:sum(rows.filter(t=>['AEPS_CSP_DEPOSIT','AEPS_CSP_AUTO_DEPOSIT'].includes(String(t.type||'').toUpperCase())))};
  }
  window.buildBCMonthlyReport=function(bcId,cycle=monthKey()){
    db.bcMonthlyReports=db.bcMonthlyReports||{};
    const bc=(db.employees||[]).find(e=>e.id===bcId);if(!bc)throw new Error('BC Incharge not found');
    const csps=(db.csps||[]).filter(c=>c.bcInchargeId===bcId);
    const rows=csps.map(c=>({cspId:c.id,cspCode:c.code,cspName:c.name,...getCspTotals(c)}));
    const sum=k=>rows.reduce((a,r)=>a+num(r[k]),0);
    const report={id:'BCREP-'+bcId+'-'+cycle,bcInchargeId:bcId,bcInchargeName:bc.name,cycle,generatedAt:now(),cspCount:csps.length,rows,totals:{transactionCount:sum('transactionCount'),transactionAmount:sum('transactionAmount'),debitCount:sum('debitCount'),debitAmount:sum('debitAmount'),creditCount:sum('creditCount'),creditAmount:sum('creditAmount'),aepsDebitCount:sum('aepsDebitCount'),aepsDebitAmount:sum('aepsDebitAmount'),aepsCreditCount:sum('aepsCreditCount'),aepsCreditAmount:sum('aepsCreditAmount'),accidentCount:sum('accident'),healthCount:sum('health'),premiumCount:sum('premium'),policyCount:sum('policyCount')}};
    db.bcMonthlyReports[report.id]=report;bc.latestBCMonthlyReport=report.id;bc.bcReportHistory=Array.isArray(bc.bcReportHistory)?bc.bcReportHistory:[];if(!bc.bcReportHistory.includes(report.id))bc.bcReportHistory.unshift(report.id);bc.bcReportHistory=bc.bcReportHistory.slice(0,60);save();return report;
  };
  window.showBCMonthlyReport=function(bcId){
    const bc=(db.employees||[]).find(e=>e.id===bcId);if(!bc)return toast('BC Incharge not found');
    db.bcMonthlyReports=db.bcMonthlyReports||{};
    const ids=Array.isArray(bc.bcReportHistory)?bc.bcReportHistory:[];
    let report=db.bcMonthlyReports[bc.latestBCMonthlyReport]||ids.map(id=>db.bcMonthlyReports[id]).find(Boolean);
    if(!report)report=buildBCMonthlyReport(bcId,monthKey());
    const all=[report,...ids.map(id=>db.bcMonthlyReports[id]).filter(r=>r&&r.id!==report.id)];
    const r=report,t=r.totals||{};
    modal('BC Incharge Cycle Report',`<div class="notice"><b>${esc(bc.name)}</b> • ${esc(bc.id)}<br>Cycle: ${esc(r.cycle)} • Generated: ${esc(r.generatedAt)}<br>Managed CSPs: <b>${r.cspCount}</b></div><div class="grid">${stat('Total transactions',t.transactionCount||0,'Count across managed CSPs')}${stat('Total transaction amount',money(t.transactionAmount||0),'Combined debit + credit movement')}${stat('AEPS Debit / Credit',money((t.aepsDebitAmount||0)+(t.aepsCreditAmount||0)),'Debit '+(t.aepsDebitCount||0)+' • Credit '+(t.aepsCreditCount||0))}${stat('Policies',t.policyCount||0,'Accident '+(t.accidentCount||0)+' • Health '+(t.healthCount||0)+' • Premium '+(t.premiumCount||0))}</div><div class="panel"><h3>CSP-wise cycle breakdown</h3><div class="tablewrap"><table><thead><tr><th>CSP</th><th>Txn count</th><th>Txn amount</th><th>Debit count / amount</th><th>Credit count / amount</th><th>Accident</th><th>Health</th><th>Premium</th></tr></thead><tbody>${(r.rows||[]).map(x=>`<tr><td>${esc(x.cspName)}<br><small>${esc(x.cspCode)}</small></td><td>${x.transactionCount}</td><td>${money(x.transactionAmount)}</td><td>${x.debitCount} / ${money(x.debitAmount)}</td><td>${x.creditCount} / ${money(x.creditAmount)}</td><td>${x.accident}</td><td>${x.health}</td><td>${x.premium}</td></tr>`).join('')||'<tr><td colspan="8">No mapped CSPs.</td></tr>'}</tbody></table></div></div><div class="panel"><h3>Saved reports</h3>${all.map(x=>`<div class="notice split"><span><b>${esc(x.cycle)}</b><br>${esc(x.generatedAt)} • ${x.cspCount} CSPs • ${x.totals?.transactionCount||0} transactions</span><button class="btn" onclick="showBCMonthlyReportById('${esc(bcId)}','${esc(x.id)}')">Open</button></div>`).join('')}</div>`);
  };
  window.showBCMonthlyReportById=function(bcId,reportId){const bc=(db.employees||[]).find(e=>e.id===bcId);if(!bc||!db.bcMonthlyReports?.[reportId])return toast('Saved report not found');bc.latestBCMonthlyReport=reportId;showBCMonthlyReport(bcId)};

  // CSP salary credit closes only that CSP's active business cycle. Old records are archived;
  // the policy ledger is cleared in both memory and IndexedDB, so a reload cannot revive them.
  async function resetCspBusinessCycle(e){
    const c=(db.csps||[]).find(x=>x.code===e?.cspCode);
    if(!c)return;
    const h=(e.salaryHistory||[])[0];
    if(h&&h.cspCycleResetDone)return;
    if(h)h.cspCycleResetDone=true;
    const code=String(c.code||'');
    const belongs=t=>String(t?.account||'')===String(c.currentAccount||'') || String(t?.description||'').includes('CSP '+code) || String(t?.description||'').includes(code+' ');
    const removedTx=(db.transactions||[]).filter(belongs);
    db.cspCycleArchive=Array.isArray(db.cspCycleArchive)?db.cspCycleArchive:[];
    db.transactions=(db.transactions||[]).filter(t=>!belongs(t));
    c.policyCounts={accident:0,health:0,premium:0};
    c.policyCount=0;c.accidentPolicyCount=0;c.healthPolicyCount=0;c.premiumPolicyCount=0;
    c.accidentPolicyChargeCollected=0;c.healthPolicyChargeCollected=0;c.premiumPolicyChargeCollected=0;
    c.cspAccidentPolicyCommission=0;c.cspHealthPolicyCommission=0;c.cspPremiumPolicyCommission=0;
    c.transactionCommission=0;c.accountOpeningCommission=0;c.balanceCheckCommission=0;c.statementCommission=0;c.totalCommission=0;
    c.policyCommissionPending=0;c.policyCommission=0;c.policyMonthKey=monthKey();
    c.policyAutomation=c.policyAutomation||{};c.policyAutomation.lastRunAt=Date.now();
    c.txnAutomation=c.txnAutomation||{};c.txnAutomation.lastRunAt=Date.now();
    e.cspTransactionCommission=0;e.cspAccountOpeningCommission=0;e.cspBalanceCheckCommission=0;e.cspStatementCommission=0;
    e.cspAccidentPolicyCommission=0;e.cspHealthPolicyCommission=0;e.cspPremiumPolicyCommission=0;
    e.accidentPolicyChargeCollected=0;e.healthPolicyChargeCollected=0;e.premiumPolicyChargeCollected=0;
    if(h){h.monthlyTxnAmount=0;h.monthlyTxnCount=0;h.monthlyDebitAmount=0;h.monthlyCreditAmount=0;h.monthlyDebitCount=0;h.monthlyCreditCount=0;h.monthlyTransactionCommission=0;h.aepsDebitAmount=0;h.aepsCreditAmount=0;h.aepsDebitCount=0;h.aepsCreditCount=0;h.aepsDebitCommission=0;h.aepsCreditCommission=0;h.monthlyPolicyCount=0;h.accidentPolicyCount=0;h.healthPolicyCount=0;h.premiumPolicyCount=0;}
    try{
      const removedPolicies=typeof window.__nexResetPolicyCycle==='function'?await window.__nexResetPolicyCycle(c.id,code):[];
      if(removedTx.length||removedPolicies.length)db.cspCycleArchive.unshift({id:uid('CSPCYCLE'),cspId:c.id,cspCode:code,cspName:c.name,closedAt:now(),transactions:removedTx,policies:removedPolicies});
      db.cspCycleArchive=db.cspCycleArchive.slice(0,100);
      save();
      notify('CSP '+code+' salary credited • active transactions and policies reset; new cycle started');
    }catch(err){
      // Do not pretend the cycle reset succeeded if persistent policy records could not be removed.
      console.error('CSP cycle reset failed',err);
      if(h)delete h.cspCycleResetDone;
      db.cspCycleArchive.unshift({id:uid('CSPCYCLE-ERROR'),cspId:c.id,cspCode:code,cspName:c.name,closedAt:now(),transactions:removedTx,policies:[],resetError:'Policy ledger reset failed'});
      db.cspCycleArchive=db.cspCycleArchive.slice(0,100);save();
      notify('CSP salary credited, but policy reset needs attention for '+code);
    }
  }
  window.salaryCreditOne=function(id,silent=false){
    const e=(db.employees||[]).find(x=>x.id===id);
    const ok=oldSalaryCreditOne?oldSalaryCreditOne(id,silent):false;
    if(ok&&e?.isCSPEmployee)resetCspBusinessCycle(e).catch(err=>console.error('CSP cycle reset error',err));
    return ok;
  };
  window.salaryCredit=function(id){
    const e=(db.employees||[]).find(x=>x.id===id);const ok=oldSalaryCredit(id);
    if(ok&&e?.isCSPEmployee){resetCspBusinessCycle(e).catch(err=>console.error('CSP cycle reset error',err));commonTargets();setTimeout(()=>policyTargetsPage(),0);toast('CSP salary credited • fresh CSP cycle is being started');}
    return ok;
  };

  // Add a persistent navigation entry for the common targets page.
  window.premiumNav=function(){
    let html=oldPremiumNav();
    if(!html.includes("data-nav=\"policyTargets\""))html=html.replace('<button data-nav="reports"', '<button data-nav="policyTargets" onclick="drawerGo(\'policyTargets\')">🎯 <span>Monthly Policy Targets</span></button><button data-nav="reports"');
    return html;
  };
  window.refresh=function(){
    const page=location.hash.slice(1)||__nexGet(K+'_LAST_PAGE')||'dashboard';
    if(page==='policyTargets'){__nexSet(K+'_LAST_PAGE',page);return policyTargetsPage();}
    return oldRefresh();
  };

  // Remove the old fixed-commission field from the live settings form and expose the shared targets there too.
  const currentSettings=window.settings;
  window.settings=function(){
    currentSettings();
    const main=document.querySelector('.main');if(!main)return;
    main.querySelectorAll('.field').forEach(el=>{if(el.querySelector('#cspFixedRate'))el.remove()});
    const old=main.querySelector('#commonPolicyTargetShortcut');if(old)old.remove();
    const t=commonTargets();
    main.insertAdjacentHTML('beforeend',`<div class="panel" id="commonPolicyTargetShortcut"><h3>🎯 Common Monthly Policy Targets</h3><p class="muted">Same target for every CSP. Categories: Accident Policy, Health Insurance, Premium Policy.</p><div class="grid">${stat('Accident Policy',t.accident,'target per CSP')}${stat('Health Insurance',t.health,'target per CSP')}${stat('Premium Policy',t.premium,'target per CSP')}</div><button class="btn primary" onclick="go('policyTargets')">Open Monthly Policy Target Page</button></div>`);
  };
  // Existing settingsSave expects the removed input. Supply a hidden zero value only during its call.
  const oldSettingsSave=window.settingsSave;
  window.settingsSave=function(e){
    let hidden=null;if(!$('cspFixedRate')){hidden=document.createElement('input');hidden.id='cspFixedRate';hidden.type='hidden';hidden.value='0';document.body.appendChild(hidden)}
    try{return oldSettingsSave(e)}finally{if(hidden)hidden.remove()}
  };


  // Common targets are initialized without wiping other saved database fields.
  commonTargets();
  (db.csps||[]).forEach(c=>{if(c.fixedIncomeManual===undefined)c.fixedIncomeManual=Number(c.fixedIncome)>0;});
  save();
})();
</script>
