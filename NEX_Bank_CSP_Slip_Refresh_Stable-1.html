<script id="nex-high-volume-policy-engine">
/* NEX HIGH-VOLUME POLICY ENGINE
   Keeps the 10k+ CSP policy workload out of the hot LocalStorage save path.
   Policy records are persisted individually in a dedicated IndexedDB store.
   The authorization UI renders only a small window and updates rows in-place.
*/
(function(){
  const PDB_NAME='NEX_CSP_POLICY_STORE_V1';
  const PDB_STORE='policies';
  let pdbPromise=null;
  let policyMap=new Map();
  let areaIndex=new Map();
  let policyDirtyTimer=null;
  let stateDirty=false;

  function openPolicyDB(){
    if(pdbPromise)return pdbPromise;
    pdbPromise=new Promise((resolve,reject)=>{
      if(!window.indexedDB)return reject(new Error('IndexedDB unavailable'));
      const req=indexedDB.open(PDB_NAME,1);
      req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(PDB_STORE))d.createObjectStore(PDB_STORE,{keyPath:'id'});};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('Policy DB open failed'));
    });
    return pdbPromise;
  }
  function txPut(p){
    return openPolicyDB().then(d=>new Promise((resolve,reject)=>{
      const tx=d.transaction(PDB_STORE,'readwrite');tx.objectStore(PDB_STORE).put(p);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Policy write failed'));
    }));
  }
  function txDelete(id){
    return openPolicyDB().then(d=>new Promise((resolve,reject)=>{
      const tx=d.transaction(PDB_STORE,'readwrite');tx.objectStore(PDB_STORE).delete(id);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Policy delete failed'));
    }));
  }
  function txAll(){
    return openPolicyDB().then(d=>new Promise((resolve,reject)=>{
      const tx=d.transaction(PDB_STORE,'readonly'),r=tx.objectStore(PDB_STORE).getAll();
      r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);
    }));
  }
  function normalizeArea(p){
    const c=(db.csps||[]).find(x=>x.id===p.cspId||x.code===p.cspCode);
    return String(c?.areaCode||p.areaCode||'').trim().toLowerCase();
  }
  function addIndex(p){
    if(!p||String(p.status||'').toUpperCase()!=='PENDING')return;
    const a=normalizeArea(p);if(!a)return;
    if(!areaIndex.has(a))areaIndex.set(a,new Set());
    areaIndex.get(a).add(p.id);
  }
  function removeIndex(p){
    if(!p)return;
    const a=normalizeArea(p),set=areaIndex.get(a);
    if(set){set.delete(p.id);if(!set.size)areaIndex.delete(a);}
  }
  function rebuildIndexes(){
    policyMap=new Map((db.cspPolicies||[]).map(p=>[p.id,p]));
    areaIndex=new Map();
    policyMap.forEach(addIndex);
  }
  async function persistPolicy(p){
    if(!p||!p.id)return false;
    policyMap.set(p.id,p);
    if(String(p.status||'').toUpperCase()==='PENDING')addIndex(p);else removeIndex(p);
    try{await txPut(p);return true}catch(e){console.error('NEX policy store write failed',e);throw e}
  }
  // Scoped batch registration: must live inside this IIFE so it can update policyMap/areaIndex.
  const policyWriteQueue=[];
  let policyWriteTimer=null, policyWriteBusy=false;
  window.__nexRegisterPolicy=function(p){
    if(!p||!p.id)return Promise.resolve(false);
    policyMap.set(p.id,p);
    if(String(p.status||'').toUpperCase()==='PENDING')addIndex(p);
    policyWriteQueue.push(p);
    if(policyWriteTimer)clearTimeout(policyWriteTimer);
    policyWriteTimer=setTimeout(flushPolicyWriteQueue,120);
    return Promise.resolve(true);
  };
  async function flushPolicyWriteQueue(){
    if(policyWriteBusy||!policyWriteQueue.length)return;
    policyWriteBusy=true; if(policyWriteTimer){clearTimeout(policyWriteTimer);policyWriteTimer=null;}
    const batch=policyWriteQueue.splice(0,policyWriteQueue.length);
    try{
      await policyReady;
      const d=await openPolicyDB();
      await new Promise((resolve,reject)=>{
        const tx=d.transaction(PDB_STORE,'readwrite'),st=tx.objectStore(PDB_STORE);
        batch.forEach(p=>st.put(p));
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Policy batch save failed'));
        tx.onabort=()=>reject(tx.error||new Error('Policy batch save aborted'));
      });
    }catch(e){
      console.error('CSP policy batch save failed; retrying in smaller chunks',e);
      for(let i=0;i<batch.length;i+=100){
        const chunk=batch.slice(i,i+100);
        try{const d=await openPolicyDB();await new Promise((resolve,reject)=>{const tx=d.transaction(PDB_STORE,'readwrite'),st=tx.objectStore(PDB_STORE);chunk.forEach(p=>st.put(p));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
        catch(err){console.error('CSP policy chunk failed',err);}
      }
    }finally{
      policyWriteBusy=false;
      if(policyWriteQueue.length){policyWriteTimer=setTimeout(flushPolicyWriteQueue,80);}
      if(typeof window.save==='function')window.save();
    }
  }

  async function persistAllPolicies(){
    const arr=[...(db.cspPolicies||[])];
    try{
      const d=await openPolicyDB();
      await new Promise((resolve,reject)=>{
        const tx=d.transaction(PDB_STORE,'readwrite'),st=tx.objectStore(PDB_STORE);
        st.clear();
        for(const p of arr)st.put(p);
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Policy migration failed'));
      });
    }catch(e){console.warn('NEX policy migration failed',e)}
  }

  const policyReady=(async()=>{
    // One-time initialization. Keep the full policy set in the dedicated IDB
    // store, but only mirror the small current-session set in memory. This avoids
    // repeatedly cloning/rendering 10k+ policy objects.
    const current=Array.isArray(db.cspPolicies)?db.cspPolicies:[];
    if(current.length){
      rebuildIndexes();
      try{await persistAllPolicies()}catch(e){}
      return true;
    }
    try{
      const d=await openPolicyDB();
      await new Promise((resolve,reject)=>{
        const tx=d.transaction(PDB_STORE,'readonly'),r=tx.objectStore(PDB_STORE).openCursor();
        r.onsuccess=()=>{const cur=r.result;if(!cur){resolve();return;} const p=cur.value;
          // Only keep pending records in the hot in-memory queue; approved/rejected
          // policies remain on disk and their monthly count is already on the CSP.
          if(String(p.status||'').toUpperCase()==='PENDING'){policyMap.set(p.id,p);addIndex(p)}
          cur.continue();};
        r.onerror=()=>reject(r.error);
      });
    }catch(e){}
    return true;
  })();

  /* Replace the hot save path: main state is persisted without the huge policy array.
     Policy records themselves are already safely persisted in the dedicated store. */
  let fastSaveTimer=null;
  let fastSaveBusy=false;
  let fastSaveAgain=false;
  async function persistFastState(){
    if(fastSaveBusy){fastSaveAgain=true;return;}
    fastSaveBusy=true;
    try{
      const d=await openFastStateDB();
      const snapshot={...db,cspPolicies:[]};
      await new Promise((resolve,reject)=>{
        const tx=d.transaction('state','readwrite');
        tx.objectStore('state').put({version:2,updatedAt:Date.now(),state:snapshot},'main');
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('state save failed'));
      });
      // Keep a small local fallback for simple WebView/file-wrapper recovery.
      // It intentionally excludes the high-volume policy ledger.
      try{localStorage.setItem(K,JSON.stringify(snapshot));localStorage.setItem(K+'_PERSIST_TS',String(Date.now()));}catch(e){}
    }catch(e){
      try{localStorage.setItem(K,JSON.stringify({...db,cspPolicies:[]}));}catch(_){}
    }finally{
      fastSaveBusy=false;
      if(fastSaveAgain){fastSaveAgain=false;queueFastStateSave(80);}
    }
  }
  function queueFastStateSave(delay=700){
    stateDirty=true;
    if(fastSaveTimer)clearTimeout(fastSaveTimer);
    fastSaveTimer=setTimeout(()=>{fastSaveTimer=null;if(stateDirty){stateDirty=false;persistFastState()}},delay);
  }
  function openFastStateDB(){
    if(window.__nexFastStateDB)return Promise.resolve(window.__nexFastStateDB);
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open('NEX_PRIVATE_BANK_PERSISTENT',3);
      req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state')};
      req.onsuccess=()=>{window.__nexFastStateDB=req.result;resolve(req.result)};
      req.onerror=()=>reject(req.error||new Error('state DB unavailable'));
    });
  }
  const fastStateSave=()=>{queueFastStateSave();return true};
  window.save=fastStateSave;

  /* Fast queue: indexed by Area Code; full pending queue + one-click bulk authorization. */
  function queueIds(area){
    const set=areaIndex.get(String(area||'').trim().toLowerCase());
    return set?[...set]:[];
  }
  function queueCard(p){
    const c=(db.csps||[]).find(q=>q.id===p.cspId||q.code===p.cspCode);
    return '<div class="notice" id="policyRow_'+esc(p.id)+'"><b>'+esc(p.id)+'</b> • '+esc(p.policyType)+' • A/C '+esc(p.accountNumber)+
      '<br>CSP: '+esc(c?.name||p.cspCode)+' • '+esc(p.cspCode)+' • Area: '+esc(c?.areaCode||'—')+
      '<br>Charge '+money(p.charge||cspPolicyMeta(p.policyType).charge)+' • CSP Commission '+money(p.cspCommission||cspPolicyMeta(p.policyType).csp)+
      '<br><button class="btn success" onclick="cspAuthorize(\''+p.id+'\')">✓ Authorize</button> <button class="btn danger" onclick="cspReject(\''+p.id+'\')">✕ Reject</button></div>';
  }
  window.renderCspAuthorizationQueue=function(area){
    const raw=String(area||'').trim(),ids=queueIds(raw.toLowerCase());
    const slice=ids.slice(0,50).map(id=>policyMap.get(id)).filter(Boolean);
    let body='<div id="policyQueueMeta" class="notice"><b>'+ids.length+'</b> pending policy request(s) • showing a 50-item preview only. <b>Bulk authorization covers all '+ids.length+' pending policies.</b></div>';
    body+='<div id="policyQueueRows">'+slice.map(queueCard).join('')+'</div>';
    if(!slice.length)body+='<div id="policyQueueEmpty" class="empty">No pending policies for this Area Code.</div>';
    body+='<button class="btn primary" style="width:100%;margin-top:8px" onclick="cspAuthorizeAllCurrentArea()">✓ Authorize All Pending Policies</button>';
    modal('🛡️ Authorization Queue • Area '+esc(raw),body);
  };
  window.cspAuthorizationSearch=async function(ev){
    ev.preventDefault();
    const area=String($('authArea')?.value||'').trim();
    if(!area)return toast('Enter Area Code');
    await policyReady;
    // Indexes are kept hot as policies are created/authorized/rejected. Do not
    // rebuild/scan the 10k+ policy ledger on every search.
    window.nexAuthArea=area;window.nexAuthOffset=0;renderCspAuthorizationQueue(area);
  };

  /* Authorization is kept in-memory and persisted as one IndexedDB record. */
  window.cspAuthorize=async function(id,silent=false,deferPersist=false,batchMode=false){
    await policyReady;
    const p=policyMap.get(id);
    if(!p||String(p.status).toUpperCase()!=='PENDING')return toast('Policy not pending');
    const meta=cspPolicyMeta(p.policyType);
    p.status='APPROVED';p.authorizedAt=now();p.updatedAt=Date.now();
    const c=(db.csps||[]).find(x=>x.id===p.cspId||x.code===p.cspCode);
    if(c){
      c.policyCount=(Number(c.policyCount)||0)+1;
      c.policyCounts=c.policyCounts||{accident:0,health:0,premium:0};
      if(p.policyType==='Accident Policy')c.policyCounts.accident=(Number(c.policyCounts.accident)||0)+1;
      else if(p.policyType==='Health Insurance')c.policyCounts.health=(Number(c.policyCounts.health)||0)+1;
      else if(p.policyType==='Premium Policy')c.policyCounts.premium=(Number(c.policyCounts.premium)||0)+1;
      c.policyCommissionPending=(Number(c.policyCommissionPending)||0)+meta.csp;
      c.policyCommission=meta.csp;
      const policyField=p.policyType==='Accident Policy'?'cspAccidentPolicyCommission':(p.policyType==='Health Insurance'?'cspHealthPolicyCommission':'cspPremiumPolicyCommission');
      c[policyField]=(Number(c[policyField])||0)+meta.csp;
      const chargeField=p.policyType==='Accident Policy'?'accidentPolicyChargeCollected':(p.policyType==='Health Insurance'?'healthPolicyChargeCollected':'premiumPolicyChargeCollected');
      c[chargeField]=(Number(c[chargeField])||0)+meta.charge;
      const emp=(db.employees||[]).find(e=>e.cspCode===c.code);
      if(emp){emp.cspPolicyCommission=(Number(emp.cspPolicyCommission)||0)+meta.csp;emp[policyField]=(Number(emp[policyField])||0)+meta.csp;emp[chargeField]=(Number(emp[chargeField])||0)+meta.charge;}
      const bi=(db.employees||[]).find(e=>e.id===c.bcInchargeId&&String(e.post||'').trim()==='BC Incharge');
      if(bi){const bcComm=Number(db.settings.bcPolicyCommission)||0.77;bi.bcPolicyCommissionPending=(Number(bi.bcPolicyCommissionPending)||0)+bcComm;c.bcPolicyCommissionPending=(Number(c.bcPolicyCommissionPending)||0)+bcComm;if(!batchMode)rec('BC_POLICY_COMMISSION',bcComm,'BC Incharge per-policy commission • '+p.policyType+' • '+c.code,bi.customerId,bi.mainAccount);}
    }
    const zm=findZonalManager();
    const zmComm=Number(db.settings.zmPolicyAuthCommission)||3.14;
    if(zm)zm.zonalPolicyCommissionPending=(Number(zm.zonalPolicyCommissionPending)||0)+zmComm;
    if(!batchMode)rec('POLICY_AUTHORIZATION',zmComm,'Zonal Manager authorization commission • '+p.policyType,p.id,zm?zm.mainAccount:'');
    removeIndex(p);
    policyMap.set(id,p);
    // Manual authorization updates the row instantly. Bulk mode skips DOM work
    // for every policy and redraws the queue once at the end.
    if(!batchMode){const row=document.getElementById('policyRow_'+CSS.escape(id));if(row)row.remove();const metaEl=document.getElementById('policyQueueMeta');if(metaEl){const n=Math.max(0,queueIds(window.nexAuthArea||'').length);metaEl.innerHTML='<b>'+n+'</b> pending policy request(s) • live optimized queue.';}}
    if(!silent)toast('Policy authorized • CSP '+money(meta.csp)+' • Zonal Manager '+money(zmComm));
    if(!deferPersist){save();persistPolicy(p).catch(()=>{});}
  };

  window.cspAuthorizeAllCurrentArea=async function(){const area=String(window.nexAuthArea||'').trim();if(!area)return toast('Enter Area Code first');await policyReady;const ids=queueIds(area).map(id=>policyMap.get(id)).filter(p=>p&&String(p.status||'').toUpperCase()==='PENDING').map(p=>p.id);if(!ids.length)return toast('No pending policies in Area '+area);if(!confirm('Authorize ALL '+ids.length+' pending policies in Area '+area+' now?'))return;const started=performance.now(),zm=findZonalManager(),zmComm=Number(db.settings.zmPolicyAuthCommission)||3.14,bcComm=Number(db.settings.bcPolicyCommission)||0.77,typeCounts={};for(const id of ids){const p=policyMap.get(id);if(!p||String(p.status||'').toUpperCase()!=='PENDING')continue;const meta=cspPolicyMeta(p.policyType);p.status='APPROVED';p.authorizedAt=now();p.updatedAt=Date.now();const c=(db.csps||[]).find(x=>x.id===p.cspId||x.code===p.cspCode);if(c){c.policyCount=(Number(c.policyCount)||0)+1;c.policyCounts=c.policyCounts||{accident:0,health:0,premium:0};if(p.policyType==='Accident Policy')c.policyCounts.accident=(Number(c.policyCounts.accident)||0)+1;else if(p.policyType==='Health Insurance')c.policyCounts.health=(Number(c.policyCounts.health)||0)+1;else if(p.policyType==='Premium Policy')c.policyCounts.premium=(Number(c.policyCounts.premium)||0)+1;c.policyCommissionPending=(Number(c.policyCommissionPending)||0)+meta.csp;c.policyCommission=meta.csp;const pf=p.policyType==='Accident Policy'?'cspAccidentPolicyCommission':(p.policyType==='Health Insurance'?'cspHealthPolicyCommission':'cspPremiumPolicyCommission'),cf=p.policyType==='Accident Policy'?'accidentPolicyChargeCollected':(p.policyType==='Health Insurance'?'healthPolicyChargeCollected':'premiumPolicyChargeCollected');c[pf]=(Number(c[pf])||0)+meta.csp;c[cf]=(Number(c[cf])||0)+meta.charge;const emp=(db.employees||[]).find(e=>e.cspCode===c.code);if(emp){emp.cspPolicyCommission=(Number(emp.cspPolicyCommission)||0)+meta.csp;emp[pf]=(Number(emp[pf])||0)+meta.csp;emp[cf]=(Number(emp[cf])||0)+meta.charge;}const bi=(db.employees||[]).find(e=>e.id===c.bcInchargeId&&String(e.post||'').trim()==='BC Incharge');if(bi){bi.bcPolicyCommissionPending=(Number(bi.bcPolicyCommissionPending)||0)+bcComm;c.bcPolicyCommissionPending=(Number(c.bcPolicyCommissionPending)||0)+bcComm;}}if(zm)zm.zonalPolicyCommissionPending=(Number(zm.zonalPolicyCommissionPending)||0)+zmComm;typeCounts[p.policyType]=(typeCounts[p.policyType]||0)+1;removeIndex(p);policyMap.set(id,p);}try{const d=await openPolicyDB();await new Promise((resolve,reject)=>{const tx=d.transaction(PDB_STORE,'readwrite'),st=tx.objectStore(PDB_STORE);for(const id of ids){const p=policyMap.get(id);if(p&&String(p.status||'').toUpperCase()==='APPROVED')st.put(p)}tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Bulk policy write failed'));});}catch(e){console.warn('Bulk policy persistence failed',e)}Object.entries(typeCounts).forEach(([type,count])=>{rec('POLICY_AUTHORIZATION_BATCH',count,'Bulk policy authorization • Area '+area+' • '+type+' • '+count+' policies');rec('ZONAL_POLICY_COMMISSION_BATCH',count*zmComm,'Zonal Manager bulk policy authorization commission • '+type+' • '+count+' policies');rec('BC_POLICY_COMMISSION_BATCH',count*bcComm,'BC Incharge bulk policy commission • '+type+' • '+count+' policies');});save();renderCspAuthorizationQueue(area);toast(`All ${ids.length} pending policies authorized • ${(performance.now()-started).toFixed(0)}ms`);};

  window.cspReject=async function(id){
    await policyReady;
    const p=policyMap.get(id);
    if(!p||String(p.status).toUpperCase()!=='PENDING')return toast('Policy not pending');
    p.status='REJECTED';p.rejectedAt=now();p.updatedAt=Date.now();
    removeIndex(p);policyMap.set(id,p);
    const row=document.getElementById('policyRow_'+CSS.escape(id));if(row)row.remove();
    toast('Policy rejected');
    save();
    persistPolicy(p).catch(()=>{});
  };

  async function cspAreaAutoApproveOnce(rule){await policyReady;cspAreaAutoNorm(rule);const ids=queueIds(rule.areaCode);let approved=0,approvedIds=[];const limits=[['Accident Policy',rule.accidentPerCycle],['Health Insurance',rule.healthPerCycle],['Premium Policy',rule.premiumPerCycle]];for(const [type,limit] of limits){if(!(limit>0))continue;let done=0;for(const id of ids){if(done>=limit)break;const p=policyMap.get(id);if(!p||String(p.status||'').toUpperCase()!=='PENDING'||String(p.policyType)!==type)continue;await window.cspAuthorize(id,true,true,true);approved++;done++;approvedIds.push(id);}}if(approved){try{const d=await openPolicyDB();await new Promise((resolve,reject)=>{const tx=d.transaction(PDB_STORE,'readwrite'),st=tx.objectStore(PDB_STORE);for(const id of approvedIds){const p=policyMap.get(id);if(p)st.put(p)}tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Area batch write failed'));});}catch(e){console.warn('Area auto batch persistence failed',e)}const typeCounts={};approvedIds.forEach(id=>{const p=policyMap.get(id);if(p)typeCounts[p.policyType]=(typeCounts[p.policyType]||0)+1});Object.entries(typeCounts).forEach(([type,count])=>{const zmComm=Number(db.settings.zmPolicyAuthCommission)||3.14,bcComm=Number(db.settings.bcPolicyCommission)||0.77;rec('AREA_AUTO_POLICY_APPROVAL',count,'Area-wise automatic approval • Area '+rule.areaCode+' • '+type+' • '+count+' approved');rec('ZONAL_POLICY_COMMISSION_BATCH',count*zmComm,'Zonal Manager area-auto authorization commission • '+type+' • '+count+' policies');rec('BC_POLICY_COMMISSION_BATCH',count*bcComm,'BC Incharge area-auto policy commission • '+type+' • '+count+' policies');});save();}return approved;}
  let areaAutoApprovalBusy=false;
  async function cspAreaAutoApprovalTick(force=false){
    if(areaAutoApprovalBusy)return;
    areaAutoApprovalBusy=true;
    try{
      await policyReady;
      let changed=false,nowMs=Date.now();
      for(const r of (db.areaPolicyAutoApproval||[])){
        cspAreaAutoNorm(r);
        if(!r.enabled)continue;
        const interval=r.intervalSec*1000;
        if(!r.lastRunAt){r.lastRunAt=nowMs;changed=true;if(!force)continue}
        const due=force?1:Math.floor((nowMs-r.lastRunAt)/interval);
        if(due<1)continue;
        const cycles=Math.min(due,3);
        for(let i=0;i<cycles;i++)await cspAreaAutoApproveOnce(r);
        r.lastRunAt=force?nowMs:r.lastRunAt+cycles*interval;changed=true;
      }
      if(changed)save();
    }catch(e){console.warn('NEX area auto-approval failed',e)}
    finally{areaAutoApprovalBusy=false}
  }
  setInterval(()=>cspAreaAutoApprovalTick(false),5000);
  setTimeout(()=>cspAreaAutoApprovalTick(false),1800);

  /* Register policies created by the automatic policy feeder immediately in the high-volume index/store. */
  const __nexPolicyWriteQueue=[];
  let __nexPolicyWriteBusy=false;
  window.__nexRegisterPolicy=async function(p){
    if(!p||!p.id)return false;
    __nexPolicyWriteQueue.push(p);
    if(__nexPolicyWriteBusy)return true;
    __nexPolicyWriteBusy=true;
    try{
      await policyReady;
      while(__nexPolicyWriteQueue.length){
        const batch=__nexPolicyWriteQueue.splice(0,200);
        const d=await openPolicyDB();
        await new Promise((resolve,reject)=>{
          const tx=d.transaction(PDB_STORE,'readwrite'),st=tx.objectStore(PDB_STORE);
          batch.forEach(x=>{policyMap.set(x.id,x);if(String(x.status||'').toUpperCase()==='PENDING')addIndex(x);st.put(x)});
          tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Policy batch save failed'));tx.onabort=()=>reject(tx.error||new Error('Policy batch save aborted'));
        });
      }
      save();return true;
    }catch(e){console.error('NEX automatic policy batch persistence failed',e);return false}
    finally{__nexPolicyWriteBusy=false;if(__nexPolicyWriteQueue.length)window.__nexRegisterPolicy(__nexPolicyWriteQueue.shift())}
  };

  /* New policy creation is uncommon, so keep the existing UI and add an IDB write. */
  const originalCreate=window.cspPolicyCreate;
  if(originalCreate)window.cspPolicyCreate=async function(ev,code){
    const before=(db.cspPolicies||[]).length;
    originalCreate(ev,code);
    const c=(db.csps||[]).find(x=>x.code===code);
    const p=(db.cspPolicies||[]).length>before?(db.cspPolicies||[])[0]:null;
    if(p){await policyReady;policyMap.set(p.id,p);addIndex(p);persistPolicy(p).catch(()=>{});}
  };

  /* Keep indexes synchronized if other modules create/remove policy records. */
  window.addEventListener('beforeunload',()=>{try{localStorage.setItem(K,JSON.stringify({...db,cspPolicies:[]}))}catch(e){}});
  policyReady.then(()=>{
    try{
      /* One-time compaction: remove the large policy array from the main LocalStorage copy. */
      localStorage.setItem(K,JSON.stringify({...db,cspPolicies:[]}));
    }catch(e){}
  });

  // Remove a CSP's policies from the dedicated IndexedDB ledger as well as hot indexes.
  // This keeps the fresh cycle genuinely empty after a reload, while callers archive the records first.
  window.__nexResetPolicyCycle = async function(cspId, cspCode){
    await policyReady;
    let all=[];
    try{all=await txAll()}catch(e){all=[...(db.cspPolicies||[]),...policyMap.values()]}
    const code=String(cspCode||'');
    const matches=new Map();
    [...all,...(db.cspPolicies||[]),...policyMap.values()].forEach(p=>{
      if(p&&(p.cspId===cspId||String(p.cspCode||'')===code))matches.set(p.id,p);
    });
    const removed=[...matches.values()];
    if(removed.length){
      try{
        const d=await openPolicyDB();
        await new Promise((resolve,reject)=>{
          const tx=d.transaction(PDB_STORE,'readwrite'),st=tx.objectStore(PDB_STORE);
          removed.forEach(p=>st.delete(p.id));
          tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('CSP cycle policy reset failed'));
        });
      }catch(err){console.warn('CSP policy ledger reset could not complete',err);throw err}
      removed.forEach(p=>{removeIndex(p);policyMap.delete(p.id)});
    }
    db.cspPolicies=(db.cspPolicies||[]).filter(p=>!(p.cspId===cspId||String(p.cspCode||'')===code));
    return removed;
  };
})();
</script>

  NEX_ACCOUNT_TYPES.smartKid={key:KID_KEY,label:'NEX Smart Kid Savings Account',minBalance:0,minCharge:0,maxTxn:KID_LIMIT,txnChargeRate:0,kid:true};

  const oldAccountTypeOptions=accountTypeOptions;
  accountTypeOptions=function(selected,includeSalary=false){let base=oldAccountTypeOptions(selected,includeSalary);if(!base.includes('SMART_KID'))base+=`<option value="SMART_KID" ${String(selected||'').toUpperCase()===KID_KEY?'selected':''}>NEX Smart Kid Savings Account (Age 7–16)</option>`;return base};
  const oldNormalizeAccountTypes=normalizeAccountTypes;

  const oldCreateCustomer=createCustomer;
  customerForm=function(){modal('Create Customer',`<form onsubmit="createCustomer(event)"><div class="formgrid">${fld('name','Full Name','required')}${fld('dob','Date of Birth','required','date')}${fld('mob','Mobile','required')}${fld('email','Email')}${fld('pan','PAN')}${fld('identity','Identity')}${fld('aadhaar','12-digit Aadhaar Number','required','text')}${fld('guardianName','Parent / Guardian Name')}${fld('guardianMobile','Parent / Guardian Mobile')}</div><div class="field"><label>Address</label><textarea id="address"></textarea></div><label><input id="kyc" type="checkbox"> KYC Verified</label><br><label><input id="aadhaarVerified" type="checkbox"> Aadhaar Verified & Linked</label><div class="notice">Demo verification status only. Real Aadhaar authentication is not performed.</div><br><button class="btn primary">Create & Generate Reference</button></form>`)};
  createCustomer=function(e){const gn=$('guardianName')?.value||'',gm=$('guardianMobile')?.value||'',nm=$('name')?.value||'',dob=$('dob')?.value||'';oldCreateCustomer(e);const c=[...(db.customers||[])].reverse().find(x=>x.name===nm&&x.dob===dob);if(c){c.guardianName=gn;c.guardianMobile=gm;save()}};
  const oldAccountManage=accountManage;
  accountManage=function(cid){const existing=db.accounts.find(x=>x.customerId===cid);if(existing)return oldAccountManage(cid);const c=cust(cid),r=db.references.find(x=>x.customerId===cid&&x.status==='AVAILABLE');if(!c||!r)return toast('Reference unavailable');modal('Create Main Account',`<div class="notice">Reference: <b>${esc(r.number)}</b><br>10-digit Account and 11-digit CIF will be generated.</div><form onsubmit="event.preventDefault();createAccountWithGuardian('${esc(r.number)}','${esc(cid)}')"><div class="formgrid"><div class="field"><label>Parent / Guardian Name</label><input id="newGuardianName" required value="${esc(c.guardianName||'')}"></div><div class="field"><label>Parent / Guardian Mobile</label><input id="newGuardianMobile" required value="${esc(c.guardianMobile||'')}"></div></div><div class="field"><label>Account Type</label><select id="newAccountType" required>${accountTypeOptions('STUDENT_SAVINGS')}</select></div><div class="notice">For NEX Smart Kid: age 7–16, no minimum balance, no account charges, ₹5,000 transaction limit, 8.25% annual interest.</div><button class="btn primary">Create ACTIVE Account</button></form>`)};
  window.createAccountWithGuardian=function(ref,cid){const c=cust(cid);if(!c)return toast('Customer not found');c.guardianName=$('newGuardianName').value.trim();c.guardianMobile=$('newGuardianMobile').value.trim();save();createAccount(ref,$('newAccountType').value)};
  const oldCreateAccount=createAccount;
  createAccount=function(ref,typeKey='STUDENT_SAVINGS'){const r=db.references.find(x=>x.number===ref&&x.status==='AVAILABLE'),c=r&&cust(r.customerId),key=String(typeKey||'').toUpperCase();if(key===KID_KEY){if(!c)return toast('Customer not found');const age=ageOnDate(c.dob);if(age<7||age>16)return toast('NEX Smart Kid account is only for ages 7–16');if(!String(c.guardianName||'').trim()||!String(c.guardianMobile||'').trim())return toast('Add Parent / Guardian Name and Mobile in the customer profile before opening a Smart Kid account');}oldCreateAccount(ref,typeKey);const a=db.accounts.find(x=>x.customerId===c?.id);if(a&&a.type===KID_KEY){a.accountTypeLabel='NEX Smart Kid Savings Account';a.kidInterestRate=KID_RATE;save()}};
  const oldUpgradeAccountDo=upgradeAccountDo;
  upgradeAccountDo=function(e,n){const key=String($('upgradeType')?.value||'').toUpperCase(),a=acc(n),c=a&&cust(a.customerId);if(key===KID_KEY){const age=ageOnDate(c?.dob);if(age<7||age>16)return toast('NEX Smart Kid account is only for ages 7–16');if(!c?.guardianName||!c?.guardianMobile){const gn=prompt('Parent / Guardian full name:',''),gm=prompt('Parent / Guardian mobile:','');if(!gn||!gm)return toast('Guardian details are required');c.guardianName=gn.trim();c.guardianMobile=gm.trim();save();}}oldUpgradeAccountDo(e,n);if(a&&a.type===KID_KEY){a.accountTypeLabel='NEX Smart Kid Savings Account';a.kidInterestRate=KID_RATE;save()}};
  function ageOnDate(dob){if(!dob)return -1;const d=new Date(dob+'T00:00:00');if(!Number.isFinite(d.getTime()))return -1;const n=new Date();let age=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))age--;return age}
  const oldAccountTxnCheck=accountTxnCheck;
  accountTxnCheck=function(a,amount,context='NORMAL'){const r=oldAccountTxnCheck(a,amount,context);if(r.ok&&accountRule(a).kid&&Number(amount)>KID_LIMIT)return {ok:false,msg:'NEX Smart Kid account limit is ₹5,000 per transaction'};return r};
  const oldAnnualInterestCredit=annualInterestCredit;
  annualInterestCredit=function(manual=false){const base=oldAnnualInterestCredit(manual);let credited=0,count=0;const year=new Date().getFullYear();db.accounts.filter(a=>a.status==='ACTIVE'&&a.type===KID_KEY).forEach(a=>{if(db.kidsInterestLedger.some(x=>x.account===a.number&&x.year===year))return;const interest=+(Number(a.balance||0)*KID_RATE/100).toFixed(2);db.kidsInterestLedger.push({account:a.number,year,interest,date:now(),rate:KID_RATE});if(interest>0){a.balance=+(Number(a.balance||0)+interest).toFixed(2);rec('ANNUAL_INTEREST',interest,'NEX Smart Kid Annual Interest • 8.25% p.a. • '+year,a.customerId,a.number);credited+=interest;count++}});if(count||manual){save();if(count){notify('Smart Kid annual interest credited • '+count+' account(s) • '+money(credited));refresh();}}return base+credited};
  const oldManualInterest=creditAccountInterestNow;
  creditAccountInterestNow=function(){oldManualInterest();let credited=0,count=0;(db.accounts||[]).filter(a=>a.status==='ACTIVE'&&a.type===KID_KEY).forEach(a=>{const interest=+(Number(a.balance||0)*KID_RATE/100).toFixed(2);if(interest>0){a.balance=+(Number(a.balance||0)+interest).toFixed(2);rec('INTEREST',interest,'Manual Smart Kid Interest Credit • 8.25%',a.customerId,a.number);credited+=interest;count++}});if(count){save();refresh();toast('Smart Kid interest credited • '+count+' account(s) • '+money(credited))}};
  function fundAvailableProfit(){return Math.max(0,+(bankProfit()-(+db.kidsFund.totalAllocated||0)).toFixed(2))}
  function runKidsFundCycle(force=false){const f=db.kidsFund||(db.kidsFund={balance:0,totalAllocated:0,totalSpent:0,lastCycleKey:Math.floor(Date.now()/FUND_INTERVAL),ledger:[]});const current=Math.floor(Date.now()/FUND_INTERVAL);if(!Number.isFinite(+f.lastCycleKey))f.lastCycleKey=current;if(force&&current<=f.lastCycleKey)f.lastCycleKey=current-1;let changed=false;let due=Math.max(0,current-(+f.lastCycleKey||0));if(due>200)due=200;for(let i=1;i<=due;i++){const cycle=(+f.lastCycleKey||0)+1,available=fundAvailableProfit(),id='UDF-'+cycle;if(!f.ledger.some(x=>x.cycleKey===cycle&&x.kind==='ALLOCATION')){if(available>=FUND_AMOUNT){f.balance=+(+f.balance+FUND_AMOUNT).toFixed(2);f.totalAllocated=+(+f.totalAllocated+FUND_AMOUNT).toFixed(2);f.ledger.unshift({id,cycleKey:cycle,kind:'ALLOCATION',amount:FUND_AMOUNT,status:'ALLOCATED',date:new Date(cycle*FUND_INTERVAL).toLocaleString('en-IN'),description:'Bank Profit allocation to NEX Udaan Kids Fund'});rec('KIDS_FUND_ALLOCATION',FUND_AMOUNT,'Bank Profit allocation to NEX Udaan Kids Fund • '+id,'','');notify('NEX Udaan Kids Fund allocation • '+money(FUND_AMOUNT));}else{f.ledger.unshift({id,cycleKey:cycle,kind:'ALLOCATION',amount:FUND_AMOUNT,status:'PENDING — INSUFFICIENT PROFIT',date:new Date(cycle*FUND_INTERVAL).toLocaleString('en-IN'),description:'Waiting for sufficient available Bank Profit'});}}f.lastCycleKey=cycle;changed=true;}if(changed)save();return changed}
  function fundLedgerRows(){return (db.kidsFund.ledger||[]).map(x=>`<tr><td>${esc(x.date||'—')}</td><td>${esc(x.id)}</td><td>${esc(x.kind)}</td><td>${money(x.amount)}</td><td><span class="badge ${x.status==='ALLOCATED'||x.status==='SPENT'?'green':'yellow'}">${esc(x.status)}</span></td><td>${esc(x.description||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No fund activity recorded yet.</td></tr>'}
  function kidsFundPage(){const f=db.kidsFund,avail=fundAvailableProfit();shell(`<div class="panel" style="border-color:#c9a45c55;background:linear-gradient(135deg,#14263b,#0c131d)"><div class="split"><div><div class="luxury-kicker" style="color:#d8b15a">NEX BANK • SOCIAL IMPACT</div><h2 style="margin:8px 0;color:#f3dca4">NEX Udaan Kids Fund</h2><p class="muted">Har Bachche Ke Sapno Ko Udaan</p></div><div style="font-size:42px">💛</div></div><div class="notice">A practice-simulator charity ledger for children's education support. Planned allocation: <b>₹3,451 every 9 minutes</b> from available Bank Profit. Not a real-world charitable transfer.</div></div><div class="grid">${stat('Available Fund Balance',money(f.balance))}${stat('Total Allocated',money(f.totalAllocated))}${stat('Total Spent',money(f.totalSpent))}${stat('Available Bank Profit',money(avail))}</div><div class="panel"><div class="split"><h3>Education Assistance / Expense</h3><button class="btn primary" onclick="kidsFundSpendForm()">+ Record Assistance</button></div><div class="notice">Expenses are recorded separately from allocations. Only the current fund balance can be spent.</div></div><div class="panel"><div class="split"><h3>Allocation Controls</h3><button class="btn" onclick="runKidsFundCycle(true);refresh()">Run Allocation Cycle Now</button></div><div class="notice">Cycle status: last processed ${f.lastCycleKey?new Date(f.lastCycleKey*FUND_INTERVAL).toLocaleString('en-IN'):'Not yet'} • Next cycle follows the 9-minute clock. Missed cycles are checked on reopen with duplicate protection.</div></div><div class="panel"><h3>Fund Ledger</h3><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Reference</th><th>Type</th><th>Amount</th><th>Status</th><th>Description</th></tr></thead><tbody>${fundLedgerRows()}</tbody></table></div></div>`,'NEX Udaan Kids Fund','Internal allocation ledger • education assistance • promotional initiative')}
  window.kidsFundSpendForm=function(){modal('Record Education Assistance',`<form onsubmit="kidsFundSpendDo(event)"><div class="field"><label>Recipient / Case reference</label><input id="kfRecipient" required maxlength="120"></div><div class="field"><label>Expense purpose</label><select id="kfPurpose"><option>Books & School Supplies</option><option>Education Fees Assistance</option><option>Learning Equipment</option><option>Transport Support</option><option>Other Education Support</option></select></div><div class="field"><label>Amount (₹)</label><input id="kfAmount" type="number" min="1" step="0.01" required></div><div class="field"><label>Notes</label><textarea id="kfNotes" maxlength="500"></textarea></div><button class="btn primary">Record Assistance Expense</button></form>`)};
  window.kidsFundSpendDo=function(e){e.preventDefault();const f=db.kidsFund,amt=+(Number($('kfAmount').value).toFixed(2));if(!Number.isFinite(amt)||amt<=0)return toast('Enter a valid amount');if(amt>f.balance)return toast('Fund balance is insufficient');f.balance=+(f.balance-amt).toFixed(2);f.totalSpent=+(f.totalSpent+amt).toFixed(2);f.ledger.unshift({id:uid('UDFSP'),kind:'EDUCATION ASSISTANCE',amount:amt,status:'SPENT',date:now(),description:$('kfPurpose').value+' • '+$('kfRecipient').value+' • '+$('kfNotes').value});rec('KIDS_FUND_EXPENSE',amt,'NEX Udaan Kids Fund education assistance • '+$('kfRecipient').value,'','');save();closeM();kidsFundPage();toast('Education assistance expense recorded')};
  const adSafe=(s,max=200)=>String(s||'').slice(0,max);
  window.openAd=function(id){const a=db.promotions.find(x=>x.id===id);if(!a||!a.active)return;trackAdView(a);a.clicks=(+a.clicks||0)+1;save();if(a.route==='kidsfund'){go('kidsfund');return}if(a.route==='kids'){go('accounts');toast('Open an eligible child customer profile to create NEX Smart Kid Savings');return}if(a.route==='promotions'){go('promotions');return}if(['accounts','investments','loans','finance','cards','csp','branches','insurance'].includes(a.route)){go(a.route);return}modal(esc(a.title),`<div class="notice" style="font-size:13px;line-height:1.7">${esc(a.details||a.description)}</div><div class="notice">NEX Private Bank Practice Simulator — promotional information only. Terms and figures are simulator settings, not real-world offers.</div><button class="btn primary" onclick="db.promotions.find(x=>x.id==='${a.id}').applications++;save();closeM();toast('Campaign interest recorded in simulator')">Register Interest (Demo)</button>`)};
  function adVisual(a){const route=String(a.route||'promotions').toLowerCase().replace(/[^a-z0-9_-]/g,'');const label=({kids:'SMART KID SAVINGS',kidsfund:'UDAAN KIDS FUND',accounts:'BANKING MADE CLEAR',investments:'SAVE • GROW • PLAN',loans:'BORROW RESPONSIBLY',finance:'SMART EMI PLANNING',cards:'NEX CARD SERVICES',csp:'DIGITAL BANKING',branches:'BRANCH NETWORK',insurance:'PROTECTION PLANS',promotions:'NEX FINANCIAL AWARENESS'})[route]||'NEX BANKING SERVICES';const symbol=esc(a.art||'✦');return a.imageUrl?`<div class="nex-art-wrap"><img src="${esc(a.imageUrl)}" alt="${esc(a.title)}" onerror="this.style.display='none'"><div class="nex-art-overlay"><span class="nex-art-logo">NEX <small>PRIVATE BANK</small></span><span class="nex-art-caption">${esc(label)}</span></div></div>`:`<div class="ad-art nex-art-${route}"><div class="nex-art-orbit"></div><div class="nex-art-symbol">${symbol}</div><div class="nex-art-wordmark"><b>NEX</b><span>PRIVATE BANK</span></div><small class="nex-art-caption">${esc(label)}</small><i class="nex-art-line"></i></div>`}
  function adBanner(a){return `<div id="nexRotatingAd" class="nex-ad-banner" data-ad-id="${esc(a.id)}"><div class="nex-ad-copy"><div class="nex-ad-kicker">NEX BANK • PRACTICE SIMULATOR</div><h2>${esc(a.title)}</h2><p>${esc(a.description)}</p><div class="nex-ad-foot"><span class="badge">${esc(a.audience||'All')} audience</span><button class="btn primary" onclick="openAd('${esc(a.id)}')">${esc(a.cta||'Explore More')} →</button></div></div><div class="nex-ad-visual">${adVisual(a)}</div></div>`}
  function activeAds(){return (db.promotions||[]).filter(a=>a.active&&Date.now()<Number(a.createdAt||Date.now())+Math.max(1,Number(a.durationDays)||30)*86400000)}
  window.resetAdRotation=function(){adIndex=0;lastAdRotateAt=Date.now();refresh()};
  let adIndex=0;let lastAdRotateAt=Date.now();window.__nexSeenAds=window.__nexSeenAds||new Set();function trackAdView(a){if(a&&!window.__nexSeenAds.has(a.id)){window.__nexSeenAds.add(a.id);a.views=(+a.views||0)+1;save()}}
  function currentAd(){const list=activeAds();if(!list.length)return null;adIndex=adIndex%list.length;return list[adIndex]}
  const oldDashboard=dashboard;
  dashboard=function(){oldDashboard();try{const main=document.querySelector('.main');if(!main)return;const a=currentAd();if(a){const div=document.createElement('div');div.innerHTML=adBanner(a);main.insertBefore(div.firstElementChild,main.children[1]||null);trackAdView(a)}}catch(e){console.warn('Ad banner render skipped',e)}};
  window.promotions=function(){const list=db.promotions||[],a=currentAd();shell(`${a?adBanner(a):'<div class="panel">No active campaigns. Enable campaigns in the editor below.</div>'}<div class="panel"><div class="split"><div><h3>Promotions & Campaigns</h3><p class="muted">22 editable simulator campaigns • Dashboard + this page • rotation every 10 seconds</p></div><button class="btn" onclick="resetAdRotation()">Reset Rotation</button></div><div class="grid">${list.map(x=>`<div class="card"><div class="split"><span class="badge ${x.active?'green':'red'}">${x.active?'ACTIVE':'PAUSED'}</span><button class="btn" onclick="adEditForm('${x.id}')">Edit</button></div>${adVisual(x)}<h3 style="margin-top:10px">${esc(x.title)}</h3><p class="muted">${esc(x.description)}</p><div class="notice">Audience: ${esc(x.audience||'All')} • Duration: ${Number(x.durationDays)||30} days</div><div class="notice">Views ${+x.views||0} • Clicks ${+x.clicks||0} • Interests ${+x.applications||0}</div><div class="actions"><button class="btn primary" onclick="openAd('${x.id}')">Preview / CTA</button><button class="btn" onclick="adToggle('${x.id}')">${x.active?'Pause':'Enable'}</button></div></div>`).join('')}</div></div>`,'Ads & Promotions','Campaign manager • auto rotation every 10 seconds • editable content and audience')};
  window.adEditForm=function(id){const a=db.promotions.find(x=>x.id===id);if(!a)return;modal('Edit Campaign — '+esc(a.title),`<form onsubmit="adSave(event,'${a.id}')"><div class="formgrid"><div class="field"><label>Campaign title</label><input id="adTitle" required maxlength="90" value="${esc(a.title)}"></div><div class="field"><label>Audience</label><select id="adAudience"><option ${a.audience==='All'?'selected':''}>All</option><option ${a.audience==='Customers'?'selected':''}>Customers</option><option ${a.audience==='CSPs'?'selected':''}>CSPs</option><option ${a.audience==='Employees'?'selected':''}>Employees</option><option ${a.audience==='Parents / Kids'?'selected':''}>Parents / Kids</option><option ${a.audience==='Business'?'selected':''}>Business</option></select></div><div class="field"><label>Artwork emoji / icon</label><input id="adArt" maxlength="12" value="${esc(a.art||'✦')}"></div><div class="field"><label>Image URL (optional)</label><input id="adImage" type="url" value="${esc(a.imageUrl||'')}"></div><div class="field"><label>CTA label</label><input id="adCTA" maxlength="35" value="${esc(a.cta||'Explore More')}"></div><div class="field"><label>Duration (days)</label><input id="adDuration" type="number" min="1" max="365" value="${Number(a.durationDays)||30}"></div><div class="field"><label>Destination</label><select id="adRoute">${[['kids','Smart Kid account'],['kidsfund','NEX Udaan Kids Fund'],['accounts','Accounts'],['investments','Deposits & Investments'],['loans','Loans'],['finance','Product Finance'],['cards','Cards'],['csp','CSP Management'],['branches','Branch Management'],['insurance','Insurance'],['promotions','Promotions Page']].map(x=>`<option value="${x[0]}" ${a.route===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div><div class="field"><label>Short description</label><textarea id="adDescription" required maxlength="260">${esc(a.description)}</textarea></div><div class="field"><label>Full details</label><textarea id="adDetails" maxlength="700">${esc(a.details||'')}</textarea></div><label><input id="adActive" type="checkbox" ${a.active?'checked':''}> Campaign active</label><br><button class="btn primary">Save Campaign</button></form>`)};
  window.adSave=function(e,id){e.preventDefault();const a=db.promotions.find(x=>x.id===id);if(!a)return;a.title=adSafe($('adTitle').value,90);a.audience=$('adAudience').value;a.art=adSafe($('adArt').value,12);a.imageUrl=adSafe($('adImage').value,500);a.cta=adSafe($('adCTA').value,35)||'Explore More';a.durationDays=Math.max(1,Math.min(365,Number($('adDuration').value)||30));a.route=$('adRoute').value;a.description=adSafe($('adDescription').value,260);a.details=adSafe($('adDetails').value,700);a.active=$('adActive').checked;a.updatedAt=now();save();closeM();promotions();toast('Campaign saved')};
  window.adToggle=function(id){const a=db.promotions.find(x=>x.id===id);if(!a)return;a.active=!a.active;save();promotions();toast(a.active?'Campaign enabled':'Campaign paused')};
  window.kidsFundPage=kidsFundPage;window.runKidsFundCycle=runKidsFundCycle;save();
  const oldResetDemo=resetDemo;

  setInterval(()=>{try{if(db.session){runKidsFundCycle(false);/* ads disabled: no rotation */}}catch(e){console.warn('NEX timed campaigns/fund cycle',e)}},5000);
  window.addEventListener('pagehide',()=>{try{save();}catch(e){}});
})();

  }

  window.finishNexKidWizard=function(){const d=fields(),age=kidAge(d.dob),amt=Number(d.initialDeposit);if(age<7||age>16)return toast('Child must be aged 7–16');if(!d.childName||!d.childMobile||!d.childAddress||!d.guardianName||!d.guardianMobile||!d.nomineeName||!d.nomineeMobile||!d.guardianConsent||!/^\d{12}$/.test(String(d.aadhaar||'')))return toast('Please complete all required fields');if(!Number.isFinite(amt)||amt<0)return toast('Invalid initial deposit');if(d.aadhaarVerified&&db.customers.some(c=>c.aadhaar===d.aadhaar&&c.aadhaarVerified))return toast('This Aadhaar is already linked to a verified customer');const id=uid('CUS'),ref=uid('REF');let number,cif;number=nexRandomAccountNumber();cif=nexRandomCIF();const customer={id,name:String(d.childName).trim(),dob:d.dob,mobile:String(d.childMobile).trim(),email:String(d.childEmail||'').trim(),pan:String(d.pan||'').trim().toUpperCase(),identity:String(d.identityDoc||'')+(d.identityRef?' • '+String(d.identityRef):''),aadhaar:String(d.aadhaar),aadhaarVerified:!!d.aadhaarVerified,address:String(d.childAddress).trim(),kyc:!!d.kycChecked,status:'ACTIVE',guardianName:String(d.guardianName).trim(),guardianMobile:String(d.guardianMobile).trim(),guardianEmail:String(d.guardianEmail||'').trim(),guardianRelation:String(d.guardianRelation||''),guardianAddress:String(d.guardianAddress||d.childAddress).trim(),nomineeName:String(d.nomineeName||'').trim(),nomineeRelation:String(d.nomineeRelation||''),nomineeMobile:String(d.nomineeMobile||'').trim(),nomineeEmail:String(d.nomineeEmail||'').trim(),guardianConsent:!!d.guardianConsent,smartKidApplication:{stepsCompleted:6,kycStatus:d.kycChecked?'DEMO COMPLETE':'PENDING',aadhaarDemoStatus:d.aadhaarVerified?'VERIFIED / LINKED':'NOT VERIFIED',depositSource:d.depositSource,submittedAt:now()}};const account={number,cif,customerId:id,type:'SMART_KID',accountTypeLabel:'NEX Smart Kid Savings Account',balance:+amt.toFixed(2),status:'ACTIVE',reference:ref,aadhaar:customer.aadhaar,aadhaarVerified:customer.aadhaarVerified,kidInterestRate:8.25,guardianName:customer.guardianName,guardianMobile:customer.guardianMobile,initialDeposit:+amt.toFixed(2),openingDepositSource:d.depositSource,openedAt:now(),smartKidApplication:{stepsCompleted:6,ageAtOpening:age,kycStatus:customer.smartKidApplication.kycStatus}};db.customers.push(customer);db.references.push({number:ref,customerId:id,status:'USED'});db.accounts.push(account);if(amt>0)rec('DEPOSIT',amt,'Initial Deposit • NEX Smart Kid Savings Account • '+String(d.depositSource||'Opening deposit'),id,number);rec('ACCOUNT_ACTIVATION',0,'NEX Smart Kid Savings Account opened after six-stage onboarding',id,number);notify('NEX Smart Kid account opened • '+number+' • '+customer.name);save();window.nexKidWizard={step:1,data:{}};toast('Smart Kid account opened • CIF and account generated');go('accounts')};

<script id="nex-aeps-automation-module">
(function(){
  /* Demo-only AEPS simulation. It is not connected to UIDAI, NPCI, any bank, or real Aadhaar authentication. */
  function aepsNormalize(){
    const st=db.settings;
    if(typeof st.aepsAutoEnabled!=='boolean')st.aepsAutoEnabled=false;
    st.aepsAutoEverySec=Math.max(5,Math.min(3600,Math.floor(Number(st.aepsAutoEverySec)||30)));
    st.aepsAutoMin=Math.max(100,Math.min(50000,Math.floor(Number(st.aepsAutoMin)||100)));
    st.aepsAutoMax=Math.max(st.aepsAutoMin,Math.min(50000,Math.floor(Number(st.aepsAutoMax)||5000)));
    st.aepsCommissionRate=Math.max(0,Math.min(100,Number.isFinite(Number(st.aepsCommissionRate))?Number(st.aepsCommissionRate):0.10));
    st.aepsAutoMode=['WITHDRAWAL','DEPOSIT','BOTH'].includes(st.aepsAutoMode)?st.aepsAutoMode:'BOTH';
    st.aepsAutoLastRun=Number(st.aepsAutoLastRun)||0;
    st.aepsCommissionEarned=Number(st.aepsCommissionEarned)||0;
  }
  function aepsRandDemoId(){
    // Synthetic 12-digit test ID; intentionally not a verified or authenticated Aadhaar.
    return '999'+String(Math.floor(Math.random()*1000000000)).padStart(9,'0');
  }
  function aepsRunCycle(force){
    aepsNormalize(); const st=db.settings, nowMs=Date.now();
    if(!force&&!st.aepsAutoEnabled)return false;
    const interval=st.aepsAutoEverySec*1000;
    if(!force&&st.aepsAutoLastRun&&nowMs-st.aepsAutoLastRun<interval)return false;
    const eligible=(db.accounts||[]).filter(a=>a.status==='ACTIVE'&&db.customers.some(c=>c.id===a.customerId));
    if(!eligible.length)return false;
    const a=eligible[Math.floor(Math.random()*eligible.length)], c=db.customers.find(x=>x.id===a.customerId);
    const min=Math.floor(st.aepsAutoMin),max=Math.floor(st.aepsAutoMax);
    const amount=Math.floor(min+Math.random()*(max-min+1));
    let type=st.aepsAutoMode;
    if(type==='BOTH')type=Math.random()<0.5?'WITHDRAWAL':'DEPOSIT';
    const demoId=aepsRandDemoId(), masked='DEMO-ID '+demoId.slice(0,3)+'•••••••••';
    if(type==='WITHDRAWAL'&&Number(a.balance||0)<amount){
      rec('AEPS_AUTO_FAILED',amount,'AEPS AUTO Withdrawal failed • insufficient demo balance • '+masked,c.id,a.number,'FAILED');
      st.aepsAutoLastRun=nowMs;save();return true;
    }
    if(type==='WITHDRAWAL'){
      a.balance=Number((Number(a.balance||0)-amount).toFixed(2));
      rec('AEPS_AUTO_WITHDRAWAL',amount,'AEPS AUTO Withdrawal • simulated identity '+masked,c.id,a.number,'SUCCESS');
    }else{
      a.balance=Number((Number(a.balance||0)+amount).toFixed(2));
      rec('AEPS_AUTO_DEPOSIT',amount,'AEPS AUTO Deposit • simulated identity '+masked,c.id,a.number,'SUCCESS');
    }
    const commission=Number((amount*st.aepsCommissionRate/100).toFixed(2));
    st.aepsCommissionEarned=Number((st.aepsCommissionEarned+commission).toFixed(2));
    if(commission>0)rec('AEPS_AUTO_COMMISSION',commission,'AEPS automation commission • '+st.aepsCommissionRate+'% of ₹'+amount.toLocaleString('en-IN')+' • demo ledger','','','SUCCESS');
    st.aepsAutoLastRun=nowMs;
    notify('AEPS demo automation: '+type+' '+money(amount)+' • commission '+money(commission));
    save(); return true;
  }
  window.aepsAutomationTick=function(force=false){try{return aepsRunCycle(!!force)}catch(e){console.warn('AEPS demo automation issue',e);return false}};
  window.aepsAutomationSave=function(e){
    e.preventDefault(); aepsNormalize(); const st=db.settings;
    st.aepsAutoEnabled=$('aepsAutoEnabled').checked;
    st.aepsAutoEverySec=Math.max(5,Math.min(3600,Math.floor(Number($('aepsAutoEvery').value)||30)));
    st.aepsAutoMin=Math.max(100,Math.min(50000,Math.floor(Number($('aepsAutoMin').value)||100)));
    st.aepsAutoMax=Math.max(st.aepsAutoMin,Math.min(50000,Math.floor(Number($('aepsAutoMax').value)||5000)));
    st.aepsAutoMode=$('aepsAutoMode').value;
    st.aepsCommissionRate=Math.max(0,Math.min(100,Number($('aepsCommissionRate').value)||0));
    st.aepsAutoLastRun=Date.now();save();refresh();toast('AEPS demo automation settings saved');
  };
  window.aepsManualForm=function(){
    modal('🪪 AEPS Manual Demo Transaction',`<div class="notice"><b>Practice simulator only</b><br>This form accepts any 12 digits as a synthetic test value. It does not verify Aadhaar and cannot access real AEPS or bank networks.</div><form onsubmit="aepsManualDo(event)"><div class="formgrid"><div class="field"><label>12-digit demo identity value</label><input id="aepsManualId" inputmode="numeric" maxlength="12" pattern="[0-9]{12}" placeholder="Enter any 12 digits" required></div><div class="field"><label>Transaction type</label><select id="aepsManualType"><option value="WITHDRAWAL">AEPS Aadhaar Withdrawal (demo)</option><option value="DEPOSIT">AEPS Aadhaar Deposit (demo)</option></select></div><div class="field"><label>Active account</label><select id="aepsManualAccount" required>${(db.accounts||[]).filter(a=>a.status==='ACTIVE').map(a=>`<option value="${esc(a.number)}">${esc(a.number)} • ${esc(db.customers.find(c=>c.id===a.customerId)?.name||'Customer')} • ${money(a.balance||0)}</option>`).join('')}</select></div><div class="field"><label>Amount ₹100–₹50,000</label><input id="aepsManualAmount" type="number" min="100" max="50000" step="1" required></div></div><button class="btn primary">Process Demo Transaction</button></form>`);
  };
  window.aepsManualDo=function(e){
    e.preventDefault(); const id=String($('aepsManualId').value||'').replace(/\D/g,''),type=$('aepsManualType').value,amount=Number($('aepsManualAmount').value),a=acc($('aepsManualAccount').value);
    if(!/^\d{12}$/.test(id))return toast('Enter exactly 12 digits (demo value only)');
    if(!a||a.status!=='ACTIVE')return toast('Select an active demo account');
    if(!Number.isInteger(amount)||amount<100||amount>50000)return toast('Amount must be ₹100–₹50,000');
    const c=db.customers.find(x=>x.id===a.customerId),masked=id.slice(0,3)+'•••••••••';
    if(type==='WITHDRAWAL'&&Number(a.balance||0)<amount){rec('AEPS_DEMO_FAILED',amount,'Manual AEPS demo withdrawal failed • insufficient balance • ID '+masked,c?.id||'',a.number,'FAILED');save();return toast('Withdrawal failed: insufficient demo balance')}
    if(type==='WITHDRAWAL'){a.balance=Number((Number(a.balance||0)-amount).toFixed(2));rec('AEPS_DEMO_WITHDRAWAL',amount,'Manual AEPS demo withdrawal • ID '+masked,c?.id||'',a.number,'SUCCESS')}
    else{a.balance=Number((Number(a.balance||0)+amount).toFixed(2));rec('AEPS_DEMO_DEPOSIT',amount,'Manual AEPS demo deposit • ID '+masked,c?.id||'',a.number,'SUCCESS')}
    aepsNormalize();const comm=Number((amount*db.settings.aepsCommissionRate/100).toFixed(2));db.settings.aepsCommissionEarned=Number((db.settings.aepsCommissionEarned+comm).toFixed(2));if(comm>0)rec('AEPS_DEMO_COMMISSION',comm,'AEPS demo commission • '+db.settings.aepsCommissionRate+'% of ₹'+amount.toLocaleString('en-IN')+' • demo ledger','','','SUCCESS');save();closeM();refresh();toast('AEPS demo '+type.toLowerCase()+' complete • commission '+money(comm));
  };
  window.aepsAutomationPage=function(){
    aepsNormalize();const st=db.settings,logs=(db.transactions||[]).filter(t=>String(t.type||'').startsWith('AEPS_AUTO_')||String(t.type||'').startsWith('AEPS_DEMO_')).slice(0,30);
    shell(`<div class="panel"><div class="split"><div><h3>AEPS Aadhaar Automation</h3><p class="muted">Separate demo automation for withdrawal and deposit.</p></div><span class="badge ${st.aepsAutoEnabled?'green':'red'}">${st.aepsAutoEnabled?'AUTOMATION ON':'AUTOMATION OFF'}</span></div><div class="notice"><b>Demo-only safeguard:</b> this module uses synthetic identity values and the local demo ledger. It does not verify Aadhaar or connect to UIDAI, NPCI, a CSP, or any real bank. It changes only the selected simulator account balances.</div><div class="grid">${stat('AEPS Demo Commission Earned',money(st.aepsCommissionEarned),st.aepsCommissionRate+'% per successful demo transaction')}${stat('Automation Interval',st.aepsAutoEverySec+' sec','Minimum 5 seconds')}${stat('Amount Range',money(st.aepsAutoMin)+' – '+money(st.aepsAutoMax),'Random demo transaction amount')}${stat('Recent AEPS Entries',logs.length,'Latest 30 shown below')}</div><div class="actions" style="justify-content:flex-start;margin-top:12px"><button class="btn primary" onclick="aepsAutomationTick(true);refresh();toast('One AEPS demo cycle attempted')">▶ Run One Demo Cycle</button><button class="btn" onclick="aepsManualForm()">＋ Manual AEPS Demo</button><button class="btn" onclick="go('settings')">⚙️ AEPS Settings</button></div></div><div class="panel"><h3>Recent AEPS demo ledger</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Status</th><th>Amount</th></tr></thead><tbody>${logs.map(t=>`<tr><td>${esc(t.date||'')}</td><td>${esc(t.type)}</td><td>${esc(t.description||'')}</td><td>${esc(t.status||'SUCCESS')}</td><td>${money(t.amount||0)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No AEPS demo transactions yet.</td></tr>'}</tbody></table></div></div>`,'AEPS Automation','Independent Aadhaar withdrawal/deposit simulator and commission tracking');
  };
  const _premiumNavAeps=premiumNav;

  settings=function(){_settingsAeps();aepsNormalize();const st=db.settings,main=document.querySelector('.main');if(!main)return;main.insertAdjacentHTML('beforeend',`<div class="panel" id="aepsSettingsPanel"><h3>🪪 AEPS Demo Automation & Commission</h3><p class="muted">These settings are independent of normal transaction automation and CSP debit/deposit commission.</p><div class="notice">Simulation only. No real Aadhaar verification or financial-network access. Automatic entries affect demo account balances, so keep automation OFF until you want to test it.</div><form onsubmit="aepsAutomationSave(event)"><div class="formgrid"><div class="field"><label>AEPS Automation</label><label><input id="aepsAutoEnabled" type="checkbox" ${st.aepsAutoEnabled?'checked':''}> Enable automatic demo withdrawals/deposits</label></div><div class="field"><label>Automation interval (seconds, minimum 5)</label><input id="aepsAutoEvery" type="number" min="5" max="3600" value="${st.aepsAutoEverySec}" required></div><div class="field"><label>Minimum transaction amount (₹)</label><input id="aepsAutoMin" type="number" min="100" max="50000" value="${st.aepsAutoMin}" required></div><div class="field"><label>Maximum transaction amount (₹)</label><input id="aepsAutoMax" type="number" min="100" max="50000" value="${st.aepsAutoMax}" required></div><div class="field"><label>AEPS transaction mode</label><select id="aepsAutoMode"><option value="BOTH" ${st.aepsAutoMode==='BOTH'?'selected':''}>Both withdrawal and deposit</option><option value="WITHDRAWAL" ${st.aepsAutoMode==='WITHDRAWAL'?'selected':''}>Withdrawal only</option><option value="DEPOSIT" ${st.aepsAutoMode==='DEPOSIT'?'selected':''}>Deposit only</option></select></div><div class="field"><label>AEPS Commission Rate (%)</label><input id="aepsCommissionRate" type="number" min="0" max="100" step="0.01" value="${st.aepsCommissionRate}" required><small>Applied separately to every successful AEPS demo transaction.</small></div></div><button class="btn primary">Save AEPS Settings</button></form><div class="notice" style="margin-top:12px">Total AEPS demo commission earned: <b>${money(st.aepsCommissionEarned)}</b></div></div>`)};
  const _refreshAeps=refresh;
  refresh=function(){if(!db.session){login();return}const p=location.hash.slice(1)||__nexGet(K+'_LAST_PAGE')||'dashboard';if(p==='aepsauto'){__nexSet(K+'_LAST_PAGE',p);return aepsAutomationPage()}return _refreshAeps()};
  const _automationRunAeps=automationRun;
